host_os = "linux"
host_arch = "amd64"
image_variant = "native-dev"
version = "0.1.0"
native_image_mode = "package-only"
check_packages = true

# Bootstrap the installer and local UI. Playable cores are installed separately
# through the core catalog; an OS build must not wait for their FPGA builds.
# MENU is display firmware required by the kit UI, not a playable core.
[[fpga_packages]]
core_id = "fes.menu"
