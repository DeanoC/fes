[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "f1beec777bf5a12f0249b9ff1698dbc4191ed2a5"
order = 10
rationale = "DeanoC mistral-stable including merged PR #6: Intel ALM infers byte-masked Cyclone V M10K true dual-port RAM through ram_style=\"m10k_tdp_byte\" as MISTRAL_M10K_TDP with CFG_BYTE_ENABLE=1 (512x20 two 10-bit lanes or 512x16 padded 8-bit bytes, A1BE/B1BE). Keeps merged PRs #1-#5 (MLAB INIT, dual-clock M10K, SDP byte enables, mixed-width SDP, unmasked TDP). Base is CMake pin ea0c44fc on YosysHQ 13b43f8c; f1beec77 merges 0a413c9e. Pair with nextpnr 04901d02 (merged PR #37); old Yosys maps masked TDP without A1BE/B1BE."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "b28e30a36b5139aaed5a5d361a30b542e6b7c758"
order = 20
rationale = "DeanoC fork for nextpnr 04901d02 Cyclone V MUL9X9/MUL18X18/MUL27X27, PLL BELs, MLAB INIT, M10K dual-clock packing, 20-bit M10K byte enables, mixed-width M10K SDP, true dual-port M10K packing including byte masks into existing tables, and corrected LAB/MLAB CLKx_INV/CLKx_SEL addresses: preserves DSP upper routing tiles on the bfa096c1 array-header baseline; fixed commit, not a moving branch."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "04901d02c3469707fccd45d6991f2905327f6352"
