[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "fca8ca0a5354e52ce0e158bc6e1eed481e590ed8"
order = 10
rationale = "Adds the kept Cyclone V HPS peripheral I2C declaration and synthesis regression on 10891a9e0256a0eac70c329aa64c633902fc6bc6. Preserves that base's CMake build surface, mixed-width TDP M10K and earlier ALM support. Pair with nextpnr 9144784d for HDMI I2C, dedicated DDR clock forwarding, dedicated SDR output/input registers, and dedicated DDR input registers; fixed reviewed local commit."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "b28e30a36b5139aaed5a5d361a30b542e6b7c758"
order = 20
rationale = "DeanoC fork for nextpnr ef29443 Cyclone V MUL9X9/MUL18X18/MUL27X27, PLL BELs, MLAB INIT, M10K dual-clock packing, 20-bit M10K byte enables, mixed-width M10K SDP, true dual-port M10K packing including byte masks and mixed-width TDP into existing tables, and corrected LAB/MLAB CLKx_INV/CLKx_SEL addresses: preserves DSP upper routing tiles on the bfa096c1 array-header baseline; fixed commit, not a moving branch."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "9144784db9b4b85c1257be4d1943b9ac11ceb3e8"
order = 30
rationale = "Adds dedicated Cyclone V DDR input registers (merged PR #44 9144784d: width-one altddio_in packs into MISTRAL_DDRIN on GPIO DATAIN.3/DATAIN.2 and CLKIN.0; unsupported widths, controls, inverted clocks and indirect data fail closed) on a1f8dbb5. Feature commit 7a0447cb. Preserves dedicated SDR input/output registers, DDR clock forwarding, HPS I2C, bidirectional GPIO input-buffer, and constant FF data routing. Uses unchanged Mistral b28e30a and Yosys fca8ca0a; published DeanoC/nextpnr mistral-stable merge."

