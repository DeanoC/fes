rationale = "DeanoC mistral-stable including merged PR #33: Cyclone V 20-bit M10K CFG_BYTE_ENABLE maps A1BE to BYTEENABLEA and the logical write enable to positive WREN[0] plus ENABLE[1], keeping independent CLKIN[0:1]. Base 79daad71 is merged PRs #21-#32 for 5CSEBA6U23I7; 71d2ffdb merges e677fc48 onto 79daad71. Requires Mistral b28e30a and Yosys 4722ee98 (merged PR #3); old nextpnr ignores A1BE JSON."

