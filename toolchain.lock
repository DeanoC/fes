rationale = "Clocks native asynchronous read-only M10Ks (merged PR #68 9cbbf735: borrow a live design clock for folded CLK1, fan both CLKIN sinks, ENABLE[0], TOP_CE0_SEL on 1024x10 without CFG_BYTE_ENABLE). On 2d3c216a. Feature commit 6535e945. Preserves narrow TDP, GPU router, selector audit, HPS_LOCATION I2C placement, TDP RDW contracts, bounded fractional-N PLLs, async TDP timing, native M10K packing, registered outputs, integer PLLs, DSPs, GPIO and SDC/QSF support. Pair with Yosys ec34fcf3 and unchanged Mistral b28e30a; published DeanoC/nextpnr mistral-stable merge."

