[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "fca8ca0a5354e52ce0e158bc6e1eed481e590ed8"
order = 10
rationale = "Adds the kept Cyclone V HPS peripheral I2C declaration and synthesis regression on 10891a9e0256a0eac70c329aa64c633902fc6bc6. Preserves that base's CMake build surface, mixed-width TDP M10K and earlier ALM support. Pair with nextpnr 10a8e890 for HDMI I2C, dedicated DDR clock forwarding, dedicated SDR output/input registers, dedicated DDR input registers, fabric-data DDR output registers, and direct altiobuf packing; fixed reviewed local commit."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "b28e30a36b5139aaed5a5d361a30b542e6b7c758"
order = 20
rationale = "DeanoC fork for nextpnr ef29443 Cyclone V MUL9X9/MUL18X18/MUL27X27, PLL BELs, MLAB INIT, M10K dual-clock packing, 20-bit M10K byte enables, mixed-width M10K SDP, true dual-port M10K packing including byte masks and mixed-width TDP into existing tables, and corrected LAB/MLAB CLKx_INV/CLKx_SEL addresses: preserves DSP upper routing tiles on the bfa096c1 array-header baseline; fixed commit, not a moving branch."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "10a8e8907f18e312b431e8303c4216f4501e6b3a"
order = 30
rationale = "Adds direct Cyclone V altiobuf packing (merged PR #47 10a8e890: width-one altiobuf_in/out/bidir fold into existing MISTRAL_IB/OB/IO BELs; bus-hold and differential mode disabled; output use_oe=FALSE; unsupported widths, parameters and pad topology fail closed) on 3e314db0. Feature commit e64b6c33. Preserves fabric-data DDR output, dedicated DDR input, SDR input/output, DDR clock forwarding, HPS I2C, bidirectional GPIO input-buffer, and constant FF data routing. Uses unchanged Mistral b28e30a and Yosys fca8ca0a; published DeanoC/nextpnr mistral-stable merge."

