[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "4722ee98b2d658adc82504112573a712d40dacf1"
order = 10
rationale = "DeanoC mistral-stable including merged PR #3: Intel ALM infers Cyclone V 512x20 M10K byte enables as two 10-bit write lanes (CFG_BYTE_ENABLE=1 and A1BE[1:0]), keeping independent CLK1/CLK2. Base is CMake pin a044a8ea (merged PRs #1-#2 on YosysHQ 13b43f8c); 4722ee98 merges e9fbe56. Pair with nextpnr 71d2ffdb (merged PR #33); old Yosys maps 20-bit byte-enable RAM without A1BE."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "b28e30a36b5139aaed5a5d361a30b542e6b7c758"
order = 20
rationale = "DeanoC fork for nextpnr 71d2ffdb Cyclone V MUL9X9/MUL18X18/MUL27X27, PLL BELs, MLAB INIT, M10K dual-clock packing, 20-bit M10K byte enables, and corrected LAB/MLAB CLKx_INV/CLKx_SEL addresses: preserves DSP upper routing tiles on the bfa096c1 array-header baseline; fixed commit, not a moving branch."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "71d2ffdbdf669475d6596352990f4d22d90a9092"
