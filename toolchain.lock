[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "da6373c0d7565f36036051efc7895fb0d9ac13c3"
order = 10
rationale = "Adds inferred Cyclone V M10K asynchronous read-output clear (merged PR #12 da6373c0: ramstyle=M10K SDP with a zero-valued async read reset maps to ACLR1, ACLR0 tied low) on 75896890. Feature commit 11df3d33. Preserves explicit ACLR primitive ports, HPS I2C, CMake build surface, mixed-width TDP M10K and earlier ALM support. Pair with nextpnr 0523e0c6 for HDMI I2C, dedicated DDR clock forwarding, dedicated SDR output/input registers, dedicated DDR input registers, fabric-data DDR output registers, direct altiobuf packing, mixed-width M10K byte enables, DDR bidirectional I/O registers, and M10K asynchronous clear; published DeanoC/yosys main merge."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "b28e30a36b5139aaed5a5d361a30b542e6b7c758"
order = 20
rationale = "DeanoC fork for nextpnr ef29443 Cyclone V MUL9X9/MUL18X18/MUL27X27, PLL BELs, MLAB INIT, M10K dual-clock packing, 20-bit M10K byte enables, mixed-width M10K SDP, true dual-port M10K packing including byte masks and mixed-width TDP into existing tables, and corrected LAB/MLAB CLKx_INV/CLKx_SEL addresses: preserves DSP upper routing tiles on the bfa096c1 array-header baseline; fixed commit, not a moving branch."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "0523e0c68e4a6ee8cfc7f324f3ed641f67fe52af"
order = 30
rationale = "Matches initialized async M10K defaults (merged PR #59 0523e0c6: omitted B1EN is preserved, ENABLE.0 is not materialized, BOT_CORECLK_SEL/BOT_INCLK_SEL stay at async defaults, constant-high A1BE omits BYTEENABLEA). On fd862a2c. Feature commit 2324c164. Preserves registered M10K outputs, ADDRSTALLA/B, Quartus SDC/QSF compatibility, generic 520 MHz PLL feedback, native 18x19 DSP, router2 QoR retry, unused-clock TCLK folding, M10K ACLR, DDR bidirectional I/O, mixed-width M10K byte enables, direct altiobuf packing, fabric-data DDR output, dedicated DDR/SDR GPIO registers, HPS I2C, bidirectional GPIO input-buffer, and constant FF data routing. Uses unchanged Mistral b28e30a and Yosys da6373c0; published DeanoC/nextpnr mistral-stable merge."

