rationale = "GPU-router timing repair uses design WNS, unfreezes still-failing frozen arcs, and re-routes same-band peer groups (merged PR #70 2ceec425 onto 2e02395). Feature commits 204a9bbb and 183ace57. Preserves async-read M10K clocks (PR #68), consumer-domain async ROM clocks (PR #69), narrow TDP, GPU router, selector audit, HPS_LOCATION I2C placement, TDP RDW contracts, bounded fractional-N PLLs, native M10K packing, registered outputs, integer PLLs, DSPs, GPIO and SDC/QSF support. Pair with Yosys ec34fcf3 and unchanged Mistral b28e30a; published DeanoC/nextpnr mistral-stable merge."

