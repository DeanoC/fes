rationale = "DeanoC mistral-stable including merged PR #37: Cyclone V TDP M10K byte enables (CFG_BYTE_ENABLE=1, A1BE/B1BE onto BYTEENABLEA/B) on merged PR #36 unmasked TDP packing. Base 06747fec is merged PRs #21-#36 for 5CSEBA6U23I7; 04901d02 merges 7be615ce. Requires Mistral b28e30a and Yosys f1beec77 (merged PR #6); old nextpnr ignores TDP byte masks. TDP byte-enable experiments use default router2."

