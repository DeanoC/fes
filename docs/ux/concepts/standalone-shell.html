<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>FES Rooms — UI concepts</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: light-dark(#e8e8e1, #101412); color: light-dark(#243631, #edf3e9); font: 400 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
    .concept-page { width: min(100%, 1024px); margin: 0 auto; }
    .concept-header { padding: 24px 20px 17px; }
    .concept-header h1 { font-size: 24px; line-height: 1.2; font-weight: 500; letter-spacing: -.025em; margin: 0 0 8px; }
    .concept-header p { margin: 0; font-size: 13px; color: light-dark(#53625a, #b5c3b9); }
    .concept-nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 19px; }
    .concept-nav button { font: inherit; min-height: 44px; padding: 9px 14px; color: inherit; border: 1px solid light-dark(#bec6b7, #4a5650); border-radius: 10px; background: light-dark(#f8f7ee, #202725); }
    .concept-nav button[aria-pressed="true"] { color: light-dark(#fcfcf3, #203727); background: light-dark(#235a46, #c8e3ac); border-color: transparent; }
    .concept-footer { padding: 18px 20px 28px; font-size: 12px; color: light-dark(#53625a, #b5c3b9); }
    .concept-footer p { margin: 0; }
    .concept-footer a { color: inherit; text-underline-offset: 3px; }
    #fes-room-concepts .fes-symbol { display: inline-block; width: 1em; flex: 0 0 auto; font-style: normal; font-size: 18px; line-height: 1; text-align: center; }
    #fes-room-concepts .fes-shortcut .fes-symbol { font-size: 24px; }
    @media (max-width: 520px) {
      .concept-header { padding: 19px 15px 15px; }
      .concept-nav { padding: 0 15px 17px; gap: 7px; }
      .concept-nav button { flex: 1 1 120px; font-size: 13px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="concept-page">
    <header class="concept-header">
      <h1>FES Rooms · UI concepts</h1>
      <p>Design research · Fictional games and device states · All interactions stay in this page</p>
    </header>
    <nav class="concept-nav" data-room-navigation aria-label="Concept Rooms">
      <button type="button" data-open-room="lounge" aria-pressed="true">Cartridge Lounge</button>
      <button type="button" data-open-room="club" aria-pressed="false">Homebrew Club</button>
      <button type="button" data-open-room="machine" aria-pressed="false">Retro Workshop</button>
    </nav>
    <!-- FES_CONCEPT_FRAGMENT -->
    <footer class="concept-footer">
      <p>No game, hardware connection, RAM test or publication is started. Changes reset on reload. See the <a href="README.md">concept notes</a> and <a href="../README.md">UX design index</a>.</p>
    </footer>
  </div>
</body>
</html>
