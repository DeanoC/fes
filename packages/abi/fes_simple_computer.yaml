schema: mister-packages.v1
kind: abi
id: fes.simple-computer
description: >-
  FES general-purpose HPS/FPGA mailbox for a standalone simple computer.
  Transport bits match fes.simple-game; ABI tag 2, keyboard rows, and a
  bounded media blob are distinct. This file does not contain MMIO or
  lifecycle programming instructions.
