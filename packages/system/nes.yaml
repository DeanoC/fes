schema: mister-packages.v1
kind: system
id: nes
description: >-
  Native standard NES cartridge contract for the pinned MiSTer core. The
  runtime validates iNES/NES2 files and transfers the unchanged cartridge.
  FDS, UNIF, NSF, trainers, saves, and auxiliary peripherals are outside this
  slice.
expected_core: NES
rbf:
  role: core
  artifact: nes.rbf
  source: source/nes_mister.yaml
media:
  - role: cartridge
    # MiSTer's NES core encodes the first FS entry as filetype 0x40:
    # bits 7:6 select NES and bits 5:0 select the FS slot.
    index: 0x40
    required: true
    extensions: [.nes]
    maximum_size: 0x2000000
    transform: nes_cartridge
core:
  reset_assert_word: 0x0001
  initial_status_word: 0x0001
  reset_release_word: 0x0000
  # The NES core instantiates hps_io with WIDE=0, so each byte is carried in
  # the low byte of its own 16-bit SPI word.
  file_wire: little_endian_bytes
input:
  player_count: 1
  player_command: 0x02
  up: 0x0008
  down: 0x0004
  left: 0x0002
  right: 0x0001
  a: 0x0010
  b: 0x0020
  start: 0x0800
  select: 0x0400
