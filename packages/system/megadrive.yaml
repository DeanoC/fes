schema: mister-packages.v1
kind: system
id: megadrive
description: >-
  Native Mega Drive profile as hardcoded in libmister-runtime.
  This is the core/media/reset/input contract, not FogCast product
  fields (aliases, covers, library roots) and not the image-owned
  absolute RBF path.

expected_core: MegaDrive

rbf:
  role: core
  artifact: megadrive.rbf
  source: source/megadrive_mister.yaml

media:
  - role: cartridge
    index: 1
    required: true
    extensions: [.md, .gen, .bin]
    maximum_size: 0x2000000

core:
  reset_assert_word: 0x0001
  initial_status_word: 0x0001
  reset_release_word: 0x0000
  file_wire: little_endian_byte_pairs

input:
  player_count: 1
  player_command: 0x02
  up: 0x0008
  down: 0x0004
  left: 0x0002
  right: 0x0001
  a: 0x0010
  b: 0x0020
  c: 0x0040
  start: 0x0080
