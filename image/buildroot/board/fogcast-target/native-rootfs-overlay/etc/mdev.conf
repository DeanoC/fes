# Device nodes are still created. The helper reads size, device/type and
# device state, then shortens the SCSI timeout when the device is optical
# or has no usable media. It does not mount or open sd/sr.
sd[a-z] 0:0 660 @/usr/sbin/fes-block-admit
sd[a-z][a-z] 0:0 660 @/usr/sbin/fes-block-admit
sr[0-9]* 0:0 660 @/usr/sbin/fes-block-admit
