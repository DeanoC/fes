# Device nodes are still created. The helper only reads size, removable and
# device/type, then shortens the SCSI timeout when the device is optical,
# removable with no media, or zero-capacity. It does not mount or open sd/sr.
sd[a-z] 0:0 660 @/usr/sbin/fes-block-admit
sd[a-z][a-z] 0:0 660 @/usr/sbin/fes-block-admit
sr[0-9]* 0:0 660 @/usr/sbin/fes-block-admit
