format = 1

[mister_runtime]
mount_path = '/runtime-source'

# One idle core, two install locations. splash_rbf: FAT /idle.rbf, which the
# derived FES U-Boot programs (`core=idle.rbf`, boot-media.lock.toml) before
# `bridge enable`. idle_rbf: the rootfs LoadIdle() artifact for Stop idle.
# Both slots must pin the same in-tree misteross splash seal (fetch/verify
# reject a difference). repository/commit are provenance (seal with the
# fes.memory.hps-ddr port layout U-Boot latches at boot); fetch copies the
# FES path.
[splash_rbf]
repository = 'sources/misteross'
commit = '22749b1c67cd0ac4a24d0ad110a0a2f9a736fac3'
path = 'sealed/fes-splash.rbf'
sha256 = '64f1f16daedba4ed19179bd5d7c6f3eb3058a688d15441c8c8d89e113060f182'
size = 1963321
fat_destination = '/idle.rbf'

[idle_rbf]
repository = 'sources/misteross'
commit = '22749b1c67cd0ac4a24d0ad110a0a2f9a736fac3'
path = 'sealed/fes-splash.rbf'
sha256 = '64f1f16daedba4ed19179bd5d7c6f3eb3058a688d15441c8c8d89e113060f182'
size = 1963321
install_path = '/usr/share/mister-runtime/idle.rbf'
