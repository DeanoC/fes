name: Stage A0 container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pinned build recipe
        uses: actions/checkout@v4

      - name: Fetch and verify the pinned Arm toolchain archive
        env:
          TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf.tar.xz
          TOOLCHAIN_SHA256: 102825ae56c9e00142d06f35d2bdd3299edb6060e84a275a25b095e66fd3fc2a
        run: |
          set -eu
          mkdir -p build/stage-a0/image-context
          cd build/stage-a0/image-context
          curl --fail --location --retry 5 --retry-all-errors "$TOOLCHAIN_URL" \
            --output gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf.tar.xz
          printf '%s  %s\n' "$TOOLCHAIN_SHA256" \
            gcc-arm-10.2-2020.11-x86_64-arm-none-linux-gnueabihf.tar.xz | sha256sum --check

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the digest-pinned image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: build/stage-a0/image-context
          file: build/stage-a0/container/Dockerfile
          push: true
          tags: ghcr.io/deanoc/fogcast-stage-a0-firstbuild:stage-a0-${{ github.sha }}
          provenance: false
          sbom: false

      - name: Record the published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          test -n "$IMAGE_DIGEST"
          printf 'Published image: ghcr.io/deanoc/fogcast-stage-a0-firstbuild@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
