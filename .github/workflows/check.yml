name: FES integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
  # The nightly regression (nightly.yml) calls this workflow for every core's
  # full simulation suite (the only place full sims run); it replaces the
  # former weekly schedule.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: fes-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded pull-request runs are cancelled; main, merge-queue and
  # nightly runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      cores: ${{ steps.plan.outputs.cores }}
      simulations: ${{ steps.plan.outputs.simulations }}
      sim_tier: ${{ steps.plan.outputs.sim_tier }}
      test_modes: ${{ steps.plan.outputs.test_modes }}
      paths_artifact: ${{ steps.plan.outputs.paths_artifact }}
      parent_partitions: ${{ steps.plan.outputs.parent_partitions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan from merge base
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ]; then BASE=0000000000000000000000000000000000000000; fi
          python3 scripts/affected.py --base "$BASE" --head "$HEAD" --output /tmp/affected.json
          python3 - <<'PYCODE'
          import json, os
          from scripts.ci_gate import validate_plan
          from scripts.ci_simulations import simulation_matrix, tier_for_event
          from scripts.test_policy import validate_test_modes
          from scripts.parent_tests import parent_partitions
          plan = json.load(open('/tmp/affected.json'))
          # Pull requests, the merge queue and main run smoke sims; nightly and manual runs run full.
          tier = tier_for_event(os.environ['EVENT'])
          validate_plan(plan['lanes'], plan['cores'])
          validate_test_modes(plan['test_modes'], plan['lanes'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('lanes=' + json.dumps(plan['lanes']) + '\n')
              output.write('cores=' + json.dumps(plan['cores']) + '\n')
              output.write('simulations=' + json.dumps(simulation_matrix(plan['cores'], tier)) + '\n')
              output.write('sim_tier=' + tier + '\n')
              output.write('test_modes=' + json.dumps(plan['test_modes']) + '\n')
              output.write('parent_partitions=' + json.dumps(parent_partitions(plan['test_modes']['media'])) + '\n')
              output.write('paths_artifact=fes-ci-plan-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
          with open('/tmp/changed-paths.json', 'w') as output:
              json.dump(plan['paths'], output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Simulation tier: ' + tier + '\n\n')
              output.write('Affected CI plan\n\n```json\n' + json.dumps(plan, indent=2) + '\n```\n')
          PYCODE
      - name: Retain affected plan artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fes-ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/affected.json
            /tmp/changed-paths.json
          retention-days: 7
          if-no-files-found: error
      - name: Always-run planner and metadata checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ]; then BASE=0000000000000000000000000000000000000000; fi
          python3 -m unittest tests.test_affected tests.test_check_diff tests.test_ci_gate tests.test_test_policy tests.test_test_changed tests.test_ci_workflow -v
          python3 scripts/check_diff.py --base "$BASE" --head "$HEAD" --fallback-base "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Documentation links and doc-reading checks
        # Documentation-only changes select no lane, so the fast parent tests
        # that read current guides run here for every change.
        run: |
          python3 scripts/check_doc_links.py
          python3 -m unittest tests.test_check_doc_links tests.test_support_matrix tests.test_image_assembly tests.test_consistency tests.test_core_build tests.test_coordination tests.test_v1_firmware_licensing_doc -v
  parent-tests:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).parent
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.plan.outputs.parent_partitions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download changed-file selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.paths_artifact }}
          path: ${{ runner.temp }}/fes-ci-plan
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - name: Install capture test dependencies
        if: matrix.partition == 'software'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo timeout --signal=TERM --kill-after=30s 600s bash -e -c '
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install --no-install-recommends -y ffmpeg
            '
          fi
          ffmpeg -version
      - name: Run selected parent partition
        env:
          TEST_VIDEO: ${{ fromJSON(needs.plan.outputs.test_modes).video }}
          TEST_MEDIA: ${{ fromJSON(needs.plan.outputs.test_modes).media }}
          PARENT_PARTITION: ${{ matrix.partition }}
        run: |
          if [ "$PARENT_PARTITION" = media ]; then
            test "$TEST_MEDIA" = true
            make platform-provision
            # Keep retries for transient registry/snapshot failures, with a hard per-attempt bound.
            for attempt in 1 2 3; do
              timeout --signal=TERM --kill-after=30s 600s make media-test-provision && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt * 20))
            done
          fi
          python3 scripts/parent_tests.py --video "$TEST_VIDEO" --media "$TEST_MEDIA" --partition "$PARENT_PARTITION" --paths-json-file "$RUNNER_TEMP/fes-ci-plan/changed-paths.json"
          if [ "$PARENT_PARTITION" = media ]; then
            make platform-test
            make -C image test FOGCAST_DIR="$PWD/sources/FogCast"
          fi
  consistency:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).parent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download changed-file selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.paths_artifact }}
          path: ${{ runner.temp }}/fes-ci-plan
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - run: |
          make check
      - name: Unused Go code
        run: python3 scripts/check_deadcode.py --paths-json-file "$RUNNER_TEMP/fes-ci-plan/changed-paths.json"
  host:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).host
    runs-on: ubuntu-24.04
    # Three parallel shards of the host Go suites (scripts/host_tests.py
    # --shard); the shards together run exactly the unsharded command set.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download changed-file selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.paths_artifact }}
          path: ${{ runner.temp }}/fes-ci-plan
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - name: UI boundary dependency
        if: matrix.shard == 3
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - env:
          TEST_FULL_RACE: ${{ fromJSON(needs.plan.outputs.test_modes).full_race }}
          SHARD: ${{ matrix.shard }}
        run: |
          flags=(--shard "$SHARD/3" --paths-json-file "$RUNNER_TEMP/fes-ci-plan/changed-paths.json" --build-host-if-needed --ui-if-needed)
          if [ "$TEST_FULL_RACE" = true ]; then flags+=(--full); fi
          python3 scripts/host_tests.py "${flags[@]}"
  runtime:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download changed-file selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.paths_artifact }}
          path: ${{ runner.temp }}/fes-ci-plan
      - name: Native runtime checks
        run: |
          python3 scripts/runtime_tests.py --paths-json-file "$RUNNER_TEMP/fes-ci-plan/changed-paths.json"
  contracts:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - run: |
          python3 -m pip install -r sources/mister-packages/requirements-test.txt
          make -C sources/mister-packages test
  fpga-producer:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).fpga
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The misteross suite includes pinned-commit comparisons (git show).
          fetch-depth: 0
          persist-credentials: false
      - name: Compiler read-audit dependency
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: PC/XT acceptance image dependencies
        run: sudo apt-get install -y binutils mtools
      - name: FPGA producer and package software tests
        run: |
          python3 - <<'PYCODE'
          import subprocess, sys
          from scripts.affected import FPGA_SOFTWARE_TESTS
          for pattern in FPGA_SOFTWARE_TESTS:
              subprocess.run([sys.executable, '-m', 'unittest', 'discover',
                              '-s', 'tests', '-p', pattern, '-v'],
                             cwd='sources/misteross', check=True)
          PYCODE
      - name: Install formal proof tools
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Prove PC/XT audio clock crossing and mutation
        run: |
          command -v yosys
          command -v yosys-abc
          python3 -m unittest discover -s tests -p test_pcxt_audio_cdc.py -v
        working-directory: sources/misteross
  simulation-tools:
    needs: plan
    if: needs.plan.outputs.cores != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Simulation build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison flex g++ make help2man libfl-dev zlib1g-dev strace
      - name: Cache pinned simulation compiler
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/fes-verilator
          key: fes-verilator-ubuntu24-${{ runner.arch }}-${{ hashFiles('scripts/ci_verilator.sh') }}
      - name: Select pinned simulation compiler
        run: |
          bash scripts/ci_verilator.sh "$RUNNER_TEMP/fes-verilator" "$RUNNER_TEMP/fes-verilator-build"
          echo "$RUNNER_TEMP/fes-verilator/bin" >> "$GITHUB_PATH"
      - name: Package the compiler once for all simulation jobs
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/fes-verilator.tar.gz" fes-verilator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fes-simulation-compiler
          path: ${{ runner.temp }}/fes-verilator.tar.gz
          retention-days: 1
          if-no-files-found: error
  fpga-simulation:
    needs: [plan, simulation-tools]
    # Job conditions are evaluated before matrix expansion, so [] skips safely.
    if: needs.plan.outputs.cores != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.simulations) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Some simulation tests compare RTL against pinned commits (git show).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fes-simulation-compiler
          path: ${{ runner.temp }}
      - name: Restore the pinned simulation compiler
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/fes-verilator.tar.gz"
          export VERILATOR_ROOT="$RUNNER_TEMP/fes-verilator/share/verilator"
          echo "VERILATOR_ROOT=$VERILATOR_ROOT" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/fes-verilator/bin" >> "$GITHUB_PATH"
          bash scripts/ci_verilator.sh "$RUNNER_TEMP/fes-verilator" "$RUNNER_TEMP/fes-verilator-build"
      - name: Install PC/XT and PC386 image tools
        if: >-
          matrix.target == 'sim-fes-pcxt-dos' || matrix.target == 'sim-fes-pc386-fesenv' ||
          matrix.target == 'sim-fes-pc386-a20' || matrix.target == 'sim-fes-pc386-c2xx' ||
          matrix.target == 'sim-fes-pc386-wait' ||
          matrix.target == 'sim-fes-pc386-speaker'
        run: sudo apt-get update && sudo apt-get install -y mtools
      - name: Simulate selected core scenarios
        env:
          TARGETS: ${{ matrix.target }}
        run: make -C sources/misteross $TARGETS
  integration:
    if: always()
    needs: [plan, parent-tests, consistency, host, runtime, contracts, fpga-producer, simulation-tools, fpga-simulation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Require every planned check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          TESTED_REVISION: ${{ github.sha }}
          INTEGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m scripts.ci_gate
      - name: Retain exact CI identity observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fes-ci-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-observation.json
          if-no-files-found: error
