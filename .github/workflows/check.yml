name: FES integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: fes-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      cores: ${{ steps.plan.outputs.cores }}
      simulations: ${{ steps.plan.outputs.simulations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan from merge base
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ]; then BASE=0000000000000000000000000000000000000000; fi
          python3 scripts/affected.py --base "$BASE" --head "$HEAD" --output /tmp/affected.json
          python3 - <<'PYCODE'
          import json, os
          from scripts.ci_gate import validate_plan
          from scripts.ci_simulations import simulation_matrix
          plan = json.load(open('/tmp/affected.json'))
          validate_plan(plan['lanes'], plan['cores'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('lanes=' + json.dumps(plan['lanes']) + '\n')
              output.write('cores=' + json.dumps(plan['cores']) + '\n')
              output.write('simulations=' + json.dumps(simulation_matrix(plan['cores'])) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Affected CI plan\n\n```json\n' + json.dumps(plan, indent=2) + '\n```\n')
          PYCODE
      - name: Always-run planner and metadata checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ]; then BASE=0000000000000000000000000000000000000000; fi
          python3 -m unittest tests.test_affected tests.test_check_diff tests.test_ci_gate -v
          python3 scripts/check_diff.py --base "$BASE" --head "$HEAD" --fallback-base "refs/remotes/origin/$DEFAULT_BRANCH"
  parent-tests:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).parent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - run: |
          make test
  consistency:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).parent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - run: |
          make check
  host:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - run: |
          make host
          cd sources/FogCast
          go test -race ./...
          make test-ui
          cd appliance
          go test -race ./...
  runtime:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          make -C sources/libmister-runtime -j2 test
  contracts:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sources/FogCast/go.mod
          cache-dependency-path: |
            sources/FogCast/go.sum
            platform/go.sum
      - run: |
          python3 -m pip install -r sources/mister-packages/requirements-test.txt
          make -C sources/mister-packages test
  fpga-producer:
    needs: plan
    if: fromJSON(needs.plan.outputs.lanes).fpga
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compiler read-audit dependency
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: FPGA producer and package software tests
        run: |
          python3 - <<'PYCODE'
          import subprocess, sys
          from scripts.affected import FPGA_SOFTWARE_TESTS
          for pattern in FPGA_SOFTWARE_TESTS:
              subprocess.run([sys.executable, '-m', 'unittest', 'discover',
                              '-s', 'tests', '-p', pattern, '-v'],
                             cwd='sources/misteross', check=True)
          PYCODE
  simulation-tools:
    needs: plan
    if: needs.plan.outputs.cores != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Simulation build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf bison flex g++ make help2man libfl-dev zlib1g-dev strace
      - name: Cache pinned simulation compiler
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/fes-verilator
          key: fes-verilator-ubuntu24-${{ runner.arch }}-${{ hashFiles('scripts/ci_verilator.sh') }}
      - name: Select pinned simulation compiler
        run: |
          bash scripts/ci_verilator.sh "$RUNNER_TEMP/fes-verilator" "$RUNNER_TEMP/fes-verilator-build"
          echo "$RUNNER_TEMP/fes-verilator/bin" >> "$GITHUB_PATH"
      - name: Package the compiler once for all simulation jobs
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/fes-verilator.tar.gz" fes-verilator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fes-simulation-compiler
          path: ${{ runner.temp }}/fes-verilator.tar.gz
          retention-days: 1
          if-no-files-found: error
  fpga-simulation:
    needs: [plan, simulation-tools]
    # Job conditions are evaluated before matrix expansion, so [] skips safely.
    if: needs.plan.outputs.cores != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.simulations) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fes-simulation-compiler
          path: ${{ runner.temp }}
      - name: Restore the pinned simulation compiler
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/fes-verilator.tar.gz"
          export VERILATOR_ROOT="$RUNNER_TEMP/fes-verilator/share/verilator"
          echo "VERILATOR_ROOT=$VERILATOR_ROOT" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/fes-verilator/bin" >> "$GITHUB_PATH"
          bash scripts/ci_verilator.sh "$RUNNER_TEMP/fes-verilator" "$RUNNER_TEMP/fes-verilator-build"
      - name: Simulate selected core scenarios
        env:
          TARGETS: ${{ matrix.target }}
        run: make -C sources/misteross $TARGETS
  integration:
    if: always()
    needs: [plan, parent-tests, consistency, host, runtime, contracts, fpga-producer, simulation-tools, fpga-simulation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every planned check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          TESTED_REVISION: ${{ github.sha }}
          INTEGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m scripts.ci_gate
      - name: Retain exact CI identity observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fes-ci-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-observation.json
          if-no-files-found: error
