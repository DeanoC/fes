name: Go modules
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            appliance/go.sum
      - run: make build-agent
      - name: Test shared appliance module
        working-directory: appliance
        run: go test -race ./...
      - name: Compile root Go packages
        run: go test -run '^$' ./...
      - name: Test changed root packages
        run: >-
          go test -race
          ./cmd/fes-boot
          ./cmd/mister-agent
          ./internal/applianceboot
          ./internal/appliancedata
          ./internal/applianceupdate
          ./internal/bootlinux
          ./internal/bridge
          ./internal/buildinputs
          ./internal/httpapi
          ./internal/input
          ./ui/tenfoot
          ./ui/tenfoot/attractvideo
      - run: make vet
