[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "e2d425dee148cc60c50f4e9b354a10d90eab15f4"
order = 10
rationale = "Coleco registered M10K mapping from registered-memory.lock (merged PR #14 e2d425de), descended from the ZX81 socket Yosys pin ec34fcf3. Paired here with the fenced ZX81 nextpnr and Mistral pins for a development-only Coleco socket."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "7ed06e21c18b047ec5c6d6a7e85e5ea2c8827039"
order = 20
rationale = "DeanoC fork master with the indexed-node routing API and the fixes nextpnr f65075bb needs on it (rnode_unlink, timing target-position mask, hashed pnode/rnode lookups: PRs #9, #10), carrying the 18db2489 CRAM footprints and af2ade0a block-mux CRAM bits. Fixed commit; pair with nextpnr f65075bb, which no longer builds against 18db2489. Previous pin: ZX81 socket Mistral pin with physical routing-mux CRAM footprints, descended from the Coleco registered-memory Mistral pin b28e30a. Required for a physical Coleco cart CRAM fence."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "f65075bbc253b7c99e8b96169f4bc85320038329"
order = 30
rationale = "DeanoC nextpnr main f65075bb after mistral-stable was merged into it and retired: adds analogue-scored candidate selection and robust analogue repair rounds for the GPU router (PR #81), the exact-search repair check (PR #82) and the port to the indexed-node Mistral API (PR #83, fixes DeanoC/fes#229) on top of everything below. Pair with Mistral 7ed06e21 (required). Previous pin: Branch fix/fes-203-slot-region head f7370550 (8bd08736 plus review fixes: HeAP slot control sets keyed on clock/SCLR/SLOAD only, capacity bounds kept necessary for shared-DATAIN enables and one-cell chains) on mistral-stable 57e394e7 (the merge of PR #77, whose head 332c883c was the previous pin), for FES issue #203. FES_RESERVED_RECT now also creates a $FES_SLOT placement region, the unbound cart packer clusters carry chains and pairs cart FFs with their driving LUTs, HeAP legalises slot FFs control-set aware with a 500-ripup limit, --placer sa is refused for carts, and a pre-placement FES slot capacity report stops with the violated bound instead of thrashing. Placement-only diagnostics on the exact SGM v2 cart show it does not fit the 41 usable LABs of 24 1 28 11 (see docs/validation/2026-09-25-coleco-sgm-cart-placement.md). The v1 Coleco bus diagnostic cart still routes and closes 56.31/107.05/173.46 MHz table and 55.99/94.27/177.37 MHz analogue on this pin, but its cart placement and therefore its RBF bytes change, so a resealed v1 diagnostic archive will differ from the one recorded under 332c883c. Previous rationale: Merged PR DeanoC/nextpnr#76 onto mistral-stable 5dea3ecd (merge commit c9330767). abce51d34 (the previous pin) is an ancestor of 5dea3ecd, so FES_RESERVED_RECT placement, physical CRAM fencing, Coleco FF route-through FES_SLOT preservation and bounded GPU architecture bind retries are all unchanged. 5dea3ecd adds the GPU-router analogue signoff repair (merged PR #75): FES issue #184's 32 KiB SGM RAM probe reproducibly reaches analogue-signoff timing closure (52.224/74.25 MHz) with that repair pass, at seed 3 weight 300 (confirmed bit-identical on three independent runs across two prior pins). PR #76 adds capped stalled-congestion acceleration on top for issue #184's other question, the socket-dev search's first seed (5) plateauing for a long stretch under the plain additive congestion schedule; PR #76's own description records that repeated runs of that exact seed/weight did not reliably reproduce the same routing (a GPU-router determinism gap unrelated to this recipe, reported but not fixed), so treat the acceleration as a general robustness improvement for whichever run lands on a plateau, not a guaranteed fix for seed 5 specifically. Commit 332c883c descends from c9330767 and additionally admits already-frozen scaffold cells at their original BELs inside FES_RESERVED_RECT for issue #191. The Coleco socket uses this with registered Yosys e2d425de and Mistral 18db248; development route evidence is not hardware acceptance."

