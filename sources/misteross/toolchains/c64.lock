rationale = "Same nextpnr pin as toolchains/apple2.lock (0259c6dc): GPU router, frozen-scaffold cart merge, and multi-region FES_RESERVED_RECT support for the two Commodore 64 cartridge sockets. Pair with Mistral 7ed06e21 (required). This core is not sealed."

