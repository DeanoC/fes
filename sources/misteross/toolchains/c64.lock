[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "5391eeb1e91b38a3d0e96d04f24cf921743c9c78"
order = 10
rationale = "Same Yosys pin as toolchain.lock (5391eeb1, DeanoC/yosys main: squash merge of #20, tri-state top-level pads to MISTRAL_IO). It descends from e2d425de (merged PR #14), so registered ramstyle=M10K stays synchronous for the Commodore 64 dual-clock video RAM port and the D64 store. Pair with nextpnr 1656e473 and Mistral 8fcc4cb4. Previous pin e2d425de."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "Same Mistral pin as toolchain.lock (8fcc4cb4, DeanoC/mistral master: squash merge of #11, multi-bit booleans set every bit). One commit on 7ed06e21; keeps the indexed-node routing API, the M10K/PLL surface and the physical routing-mux CRAM footprints the frozen-socket CRAM fence and ROM map rely on. Required by nextpnr 1656e473. Previous pin 7ed06e21."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "1656e473e1442f9b734ff5f4cdfddfd013846b9e"
order = 30
rationale = "Same nextpnr pin as toolchain.lock (1656e473, DeanoC/nextpnr main: squash merge of #136, general Cyclone V PLL solver/packer). It descends from 0259c6dc, so the GPU router, frozen-scaffold cart merge and multi-region FES_RESERVED_RECT support for the two Commodore 64 cartridge sockets are kept. On 0259c6dc the C64 shell overran the per-seed budget in placement and its GPU router did not converge (DeanoC/nextpnr#150, #151); 1656e473 places and routes the same netlist. Its PLL route-log format is the #136 VCO/counter form, and boundary FFs may gain a paired $ROUTETHRU buffer (validated as in #534). Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). This core is not sealed. Previous pin 0259c6dc."

