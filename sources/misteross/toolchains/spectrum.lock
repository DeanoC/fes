[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "e2d425dee148cc60c50f4e9b354a10d90eab15f4"
order = 10
rationale = "Registered ramstyle=M10K stays synchronous (merged PR #14 e2d425de), the Yosys pin shared with toolchains/apple2.lock. The Spectrum shell needs it for the registered dual-clock video RAM port and the tape-store TDP. Pair with nextpnr 0259c6dc and Mistral 7ed06e21."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "7ed06e21c18b047ec5c6d6a7e85e5ea2c8827039"
order = 20
rationale = "Indexed-node Mistral master required by nextpnr 0259c6dc, carrying the M10K/PLL surface and physical routing-mux CRAM footprints the frozen-socket CRAM fence and ROM map rely on."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "0259c6dc1c46dd46fe79f3923a17ad36d2513421"
order = 30
rationale = "DeanoC nextpnr 0259c6dc (PR #87 on main a93fe013): GPU router with analogue timing repair, calibrated placement prediction (PR #86), frozen-scaffold cart merge that drives every cart input from the shell (every traced cart clock on the socket clock, undriven cart inputs rejected; FES #250), and the multi-region FES_RESERVED_RECT / --fes-cart-region support (PRs #79/#80) that the four Spectrum edge sockets use. Same pin as toolchains/apple2.lock. Pair with Mistral 7ed06e21 (required)."

