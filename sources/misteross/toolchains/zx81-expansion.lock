[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "ec34fcf38986217af9b5558936044b7197d968a7"
order = 10
rationale = "CMake build adds native Cyclone V M10K flow-through inference (merged PR #13 ec34fcf3: simple-dual 1024x10/512x20/256x40 and two-write/two-read TDP with CFG_ASYNC_READ). On da6373c0. Feature commit 540998e3. Preserves asynchronous clear, dual-clock, byte-enable, mixed-width TDP and earlier ALM support. Pair with nextpnr a93fe013 (and Mistral 7ed06e21); published DeanoC/yosys main merge."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "7ed06e21c18b047ec5c6d6a7e85e5ea2c8827039"
order = 20
rationale = "DeanoC fork master with the indexed-node routing API and the fixes nextpnr a93fe013 needs on it (rnode_unlink, timing target-position mask, hashed pnode/rnode lookups: PRs #9, #10), carrying the 18db2489 CRAM footprints and af2ade0a block-mux CRAM bits. Fixed commit; pair with nextpnr a93fe013, which no longer builds against 18db2489. Previous pin: Reviewed Mistral PR #3 adds const physical routing-mux CRAM footprints and device dimensions on b28e30a. Exact seven offending muxes and 14 observed outside bits are covered by the standalone regression. Scoped ZX81 cart routing uses this API to enforce the fixed socket CRAM boundary; default and registered-memory locks retain their qualified library revisions."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "69f8237b2a654942f88d1ef7ca1552d0711aa2c8"
order = 30
rationale = "DeanoC nextpnr 69f8237b (PR #94, parent a93fe013): a flip-flop with no async clear no longer stays on a LAB clear another flop uses. The open half takes an unused ACLR slot and that slot selects the dedicated inactive clear; TCLR_SEL/BCLR_SEL are numeric. Reloading FES_LABSTATE_V1 runs the same park, because a locked LAB skips control-set assignment; a shell with both ACLR slots live is rejected. Repaired ZX81 seed 10 keeps its placement and gpo[24] route (FES #309). Previous pin 7eb7b277 parked open flops on a fresh route only. Pair with unchanged Mistral 7ed06e21 and Yosys ec34fcf3. Previous pin a93fe013: merge of PR #86, placement prediction calibrated against routed delays (FES #236). Previous pin 267710a3 preserved frozen CRAM through cartridge cleanup (FES #237). Other core locks stay on their own pins."

