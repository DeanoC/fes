[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "ec34fcf38986217af9b5558936044b7197d968a7"
order = 10
rationale = "CMake build adds native Cyclone V M10K flow-through inference (merged PR #13 ec34fcf3: simple-dual 1024x10/512x20/256x40 and two-write/two-read TDP with CFG_ASYNC_READ). On da6373c0. Feature commit 540998e3. Preserves asynchronous clear, dual-clock, byte-enable, mixed-width TDP and earlier ALM support. Pair with nextpnr d672fade; published DeanoC/yosys main merge."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "7ed06e21c18b047ec5c6d6a7e85e5ea2c8827039"
order = 20
rationale = "DeanoC fork master with the indexed-node routing API and the fixes nextpnr f65075bb needs on it (rnode_unlink, timing target-position mask, hashed pnode/rnode lookups: PRs #9, #10), carrying the 18db2489 CRAM footprints and af2ade0a block-mux CRAM bits. Fixed commit; pair with nextpnr f65075bb, which no longer builds against 18db2489. Previous pin: Reviewed Mistral PR #3 adds const physical routing-mux CRAM footprints and device dimensions on b28e30a. Exact seven offending muxes and 14 observed outside bits are covered by the standalone regression. Scoped ZX81 cart routing uses this API to enforce the fixed socket CRAM boundary; default and registered-memory locks retain their qualified library revisions."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "f65075bbc253b7c99e8b96169f4bc85320038329"
order = 30
rationale = "DeanoC nextpnr main f65075bb after mistral-stable was merged into it and retired: adds analogue-scored candidate selection and robust analogue repair rounds for the GPU router (PR #81), the exact-search repair check (PR #82) and the port to the indexed-node Mistral API (PR #83, fixes DeanoC/fes#229) on top of everything below. Pair with Mistral 7ed06e21 (required). Previous pin: Reviewed nextpnr PR #73 preserves explicit socket clocks, bound shell RAM/constants, correct BUF LUT emission, validated complete pin/LAB snapshots and isolated frozen LAB placement. Revision 74f26cc1 adds a physical routing-mux CRAM fence and local cart constant drivers. The real sealed ZX81 shell plus RAM cart passes HIP routing, both declared clocks, identical header and zero outside-slot non-CRC differences. Published scoped feature revision; hardware acceptance is separate. Requires Mistral 18db248 and Yosys ec34fcf3. Default and registered-memory lanes remain separately pinned."

