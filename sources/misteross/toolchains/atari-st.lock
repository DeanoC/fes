commit = "5391eeb1e91b38a3d0e96d04f24cf921743c9c78"
order = 10
rationale = "Same Yosys commit as toolchain.lock (5391eeb1, squash merge of #20). Paired here with nextpnr b7ba9b6e and Mistral 8fcc4cb4. Previous Atari ST pin 886afa63."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "Same Mistral commit as toolchain.lock (8fcc4cb4, squash merge of #11). Keeps the indexed-node routing API and the physical routing-mux CRAM footprints the frozen-socket fence uses. Paired here with nextpnr b7ba9b6e. Previous Atari ST pin 7ed06e21."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "b7ba9b6e3d67737c77aaea6bb23ac8d1b6c76cd2"
order = 30
rationale = "Atari ST HIP pin at current DeanoC/nextpnr main b7ba9b6e (#197 connection diagnostics on #196, which bounds GPU-router architecture-rejection retries). toolchain.lock stays at 9128800f: that shared pin lacks #196 and is deliberately before #172. nextpnr main rejects a shell frozen on the older pin with Invalid frozen physical pin for video_clock.outclk, so the shell and both exact-shell parts must be rebuilt together. Yosys 5391eeb1 and Mistral 8fcc4cb4 match the shared pin. This lock does not accept a kit seal."

