[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "3a5accbd78c526ab7bae32640044a2e062a3cfc9"
order = 10
rationale = "DeanoC/yosys main commit 3a5accbd (squash merge of #25: forwards A_SIGNED/B_SIGNED on MISTRAL_MUL cells); its CMake build retains the #20 inferred tri-state top-level pad mapping, native Cyclone V M10K support, fpga2sdram blackbox and #21 Cyclone V control block atom blackboxes. Paired with DeanoC/nextpnr 6162fcaa and Mistral 8fcc4cb4. Previous pin 5391eeb1 (merge of #20: intel_alm maps inferred tri-state top-level pads to MISTRAL_IO, splitting shared tri-state drivers per pad)."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4 (squash merge of #11: cyclonev sets every bit of known redundant multi-bit booleans such as GPIO slew_rate_slow, advertised as MISTRAL_MULTIBIT_BOOL_SET, which nextpnr #118 needs for slow slew; distinct per-bit fields such as HIP.VC_ENABLE are left alone). Keeps the indexed-node routing API (rnode_coords/pnode_coords/xycoords labels, rnode_index handles) plus the fixes current DeanoC nextpnr needs on it: implemented rnode_unlink (PR #9, MISTRAL_RNODE_UNLINK), timing target-position mask and restored hashed pnode/rnode lookups (PR #10). Carries the physical routing-mux, inverter and block-mux CRAM footprints (18db2489, af2ade0a) the FES shell/cart CRAM fence uses, and everything from b28e30a3. Fixed commit, not a moving branch; pair with nextpnr 6162fcaa. Previous pin 7ed06e21."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "6162fcaa3c433ebd8bd50bb42a3c8fb36d686565"
order = 30
rationale = "DeanoC/nextpnr main 6162fcaa (squash merge of #327: Mistral models the HPS FPGA-interface atoms and ties off constant HPS inputs). Over 1eecf877 it adds #276 (a user-locked FF keeps its ALM route-through in a FES reservation), #289, #292, #293, #291, #294, the GPU router fixes #229, #271, #278 and #281, #287 with its #290 revert, the opt-ins #296 and #299, the HPS interface work #301, #302, #303 and #327, and the routed-timing work #305 to #321 (#311 keeps routed early/late timing independent of IO constraints, #313 uses each register's actual clock edge, #319 guards LUT input routes with the native minimum-delay scale). Its 27 new CLI options are opt-in and stay at their defaults (the 134-option schema in scripts/pnr_recipe.py), so the ZX81 nextpnr argv is unchanged. fes.ts1500 missed its 52.224 MHz system clock on all 15 first-pass seed/weight trials at 1eecf877 after a closure-only BUILD_ID move (DeanoC/fes#1807: best 51.15 MHz). DeanoC/fes#1848 then tried bd7a1c0d, where fes.zx80 missed once #1752 moved the family's BUILD_IDs (worst ratio 0.967), and bec82e36, where fes.zx81 missed (worst ratio 0.945). Pair with Yosys 3a5accbd and Mistral 8fcc4cb4; nextpnr's own CI builds this commit against Mistral 5e311528, but it builds and validates on 8fcc4cb4, which every other FES lock pins. Previous pin 1eecf877; previous rationale: DeanoC/nextpnr main commit 1eecf877 (squash merge of #267, issue #236: model the terminal LUT input mux, include the terminal GOUT delay in critical-cohort timing, and rank opt-in private pins against setup deadlines); also includes #268/#269 (heap placer checks congestion capacity per constrained region). Pair with Yosys 3a5accbd and Mistral 8fcc4cb4 (required). Previous candidate pin 5558fe25 (#267 branch, without the GOUT and heap-region changes). Production shell/cart/seal qualification on this pin is required before promotion."

