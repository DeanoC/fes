[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "1f7d0273b55bd48343b149c86ca9766d6d48c174"
order = 10
rationale = "DeanoC/yosys PR #68 head 1f7d0273b5 on main commit 238eac9a49, the pin of cores/fes-common/rtl/i386/toolchain.lock. #68 reads the hardware thread count once: on 238eac9a ThreadPool::pool_size opened /sys/devices/system/cpu/online on every call (#67), about 1.3 million times for the pc386 M4 shell, and the producer's compiler read audit exceeded its trace bound. Synthesis results are unchanged. Move to main's commit once #68 merges. The pc386 machine is read with the Yosys the i386 CPU is read with, since the M5 package puts both in one netlist. The shared toolchain.lock stays at 3a5accbd. Pair with nextpnr bd7a1c0d and Mistral 8fcc4cb4. Previous pin 238eac9a49."

