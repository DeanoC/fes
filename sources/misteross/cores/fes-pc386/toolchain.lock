[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "e240a4653bb6578e0b267f730128f8a5dac28483"
order = 10
rationale = "DeanoC/yosys main commit e240a465, the squash merge of #76: rename -unescape gives names unique within one run, never spells a keyword, and renames memories (#75). The seal runs it in the same Yosys run in place of the Python identifier rewrite (#1581 S4, scripts/yosys_netlist.py); at 0a7927bf it asserted on pc386_system, where cpu.ex_out and cpu.ex.out both map to cpu_ex_out. Since 0a7927bf (#68, the hardware thread count read once) it adds #70 (AGENTS.md only) and #76. The i386 lock pins the same commit (#1581 D2), so one Yosys reads the CPU for lockstep, the Quartus spikes and this seal. The shared toolchain.lock stays at 3a5accbd. Pair with nextpnr bd7a1c0d and Mistral 8fcc4cb4. Previous pin 0a7927bf."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4, as the i386 and Spectrum locks pin it; required by nextpnr bd7a1c0d."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "bd7a1c0d2e1a36ff64ad303edffac87fdabd66bb"
order = 30
rationale = "DeanoC/nextpnr main commit bd7a1c0d (squash merge of #292), the i386 lock's pin and the first one this core routed on: the pc386 M4 diagnostic package was its first routed result (docs/validation/2026-10-28-pc386-m4-diagnostic). That OSS producer was deleted in M5 (#1268); fes.pc386 seals with Quartus, and nextpnr routes of pc386 are parked (#1235). It is the last known good for this core, not a required pin. Pair with Mistral 8fcc4cb4 (required)."

[tool.verilator]
repo = "https://github.com/verilator/verilator.git"
commit = "bbb60a403932a9f695cb6ff001ceb73de6ad9234"
order = 40
rationale = "Verilator v5.054 (2026-11-01), as the i386 lock pins it (#1581 S3). The previous pin, 5e4151e3, was an untagged 5.051 development snapshot that stops with an internal error at fes_i386_seq.sv:317. No pc386 build or simulation reads this pin: the producer takes only Yosys from this lock's slot, and the pc386 simulations, the i386 CPU in them included, take $(VERILATOR), the system Verilator by default. Only the standalone i386 tests (scripts/i386_verilator.py) take Verilator from a slot, the i386 lock's. The pin keeps this lock's slot on the same Verilator as the i386 lock. The pc386 simulations do not build under v5.054 yet (#1678)."

