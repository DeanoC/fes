rationale = "DeanoC fork master 8fcc4cb4, as the i386 and Spectrum locks pin it; required by nextpnr bd7a1c0d."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "bd7a1c0d2e1a36ff64ad303edffac87fdabd66bb"
