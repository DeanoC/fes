[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "238eac9a49002722cef800cacaa763911e01f240"
order = 10
rationale = "DeanoC/yosys main commit 238eac9a49, the pin of cores/fes-common/rtl/i386/toolchain.lock. The pc386 machine is read with the Yosys the i386 CPU is read with, since the M5 package puts both in one netlist; the M2 machine-only synthesis (scripts/synth_fes_pc386.py) used it too. The shared toolchain.lock stays at 3a5accbd. Pair with nextpnr bd7a1c0d and Mistral 8fcc4cb4."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4, as the i386 and Spectrum locks pin it; required by nextpnr bd7a1c0d."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "bd7a1c0d2e1a36ff64ad303edffac87fdabd66bb"
order = 30
rationale = "DeanoC/nextpnr main commit bd7a1c0d (squash merge of #292), the i386 lock's pin and the first one this core routes on: the pc386 M4 diagnostic package (scripts/build_fes_pc386_oss.py) is its first routed result. It is the last known good for this core, not a required pin. Pair with Mistral 8fcc4cb4 (required)."

