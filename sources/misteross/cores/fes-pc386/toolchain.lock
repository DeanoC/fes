rationale = "DeanoC/nextpnr main commit bd7a1c0d (squash merge of #292), the i386 lock's pin and the first one this core routes on: the pc386 M4 diagnostic package (scripts/build_fes_pc386_oss.py) is its first routed result. It is the last known good for this core, not a required pin. Pair with Mistral 8fcc4cb4 (required)."

