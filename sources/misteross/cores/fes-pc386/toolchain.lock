[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "0a7927bf126eb3d868c50b3bb5e11b69ff656ea9"
order = 10
rationale = "DeanoC/yosys main commit 0a7927bf, the squash merge of #68, which reads the hardware thread count once: ThreadPool::pool_size had opened /sys/devices/system/cpu/online on every call (#67), about 1.3 million times for the pc386 M4 shell, past the producer's compiler read audit bound. Since 238eac9a49, the i386 lock's pin, main also adds #54 (opt_merge keeps replicated logic on nomerge wires), #57 (proc_dlatch carries nomerge through latch inference) and #60 (wreduce revisits readers when a shared Y is trimmed), so the netlist may differ from 238eac9a's. The pc386 machine and the i386 CPU share one netlist from M5, so the i386 lock should follow in its own change; until then they differ by these four commits. The shared toolchain.lock stays at 3a5accbd. Pair with nextpnr bd7a1c0d and Mistral 8fcc4cb4. Previous pin 1f7d0273b5, #68's head."

