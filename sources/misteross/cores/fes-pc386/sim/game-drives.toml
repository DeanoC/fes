# The pc386 game drives (scripts/build_pc386_game_drive.py; docs/pc386-game-drives.md).
#
# Each drive is the FreeDOS games image (build_pc386_freedos_image.py
# --profile games) on a disk of `cylinders` cylinders of 16 heads and 63
# sectors, plus each title's files, copied from a source the user supplies.
# Nothing a title copies is in the repository: a title names its source
# (an eXoDOS zip, or a folder of the DOS Benchmark Pack) and pins its SHA-256
# (a zip's bytes; for a folder, each file's relative path and SHA-256, sorted).
#
# A title:
#   id       the census and runner name
#   bucket   its census bucket ([buckets])
#   source   [sources] key, default exodos; path: the zip or folder in it
#   copy     folders copied to C:, in order: { from = folder in the source,
#            to = C: directory, skip = subfolders left out, flat = no
#            subfolders }. A later entry replaces an earlier one's files,
#            as eXoDOS's launchers copy a sound card's config folder over
#            the game's.
#   launch   what the runner types at the C:\> prompt; | is Enter
#   keys     [seconds after the launch is typed, keys] for the simulation
#            (machine_tb --keys-after-type); a kit runner sends its own
#   limit    simulated seconds the census runs the title for
#   opl2     the game suite requires OPL2 output (its acceptance titles)
#
# Sound setups follow eXoDOS's Sound Blaster choice (its sb16 folder). The
# machine's card is a Sound Blaster 2.0 at the factory 220h, IRQ 7, DMA 1.

[sources.exodos]
kind = "zip"
env = "FES_PC386_GAMES"
default = "/mnt/emuhd/Games/PC DOS/Collections/eXoDOS 6.04 Full/eXoDOS/eXo/eXoDOS"

[sources.dosbench]
kind = "tree"
env = "FES_PC386_DOSBENCH"
default = "~/fes-drives/pc386/sources/dosbench"

[buckets]
real = "real mode in conventional memory"
xms = "XMS through HIMEM, unreal mode or an own 386 memory manager"
dos4gw = "DOS/4GW at CPL 0"
cpl0 = "other CPL-0 DOS extenders (DOS/32A, PMODE/W, Phar Lap)"
dpmi3 = "ring-3 DPMI hosts (CWSDPMI, Borland RTM and 32RTM)"
ems = "uses or needs EMS (EMM386 or another expanded-memory manager)"
386 = "needs a 386 in real mode"
fpu = "needs an x87"
sound = "Sound Blaster Pro or other sound setups"
program = "non-game programs"

[drives.real]
cylinders = 260
description = "Real-mode and 386 real-mode games, EMS users and sound setups"

