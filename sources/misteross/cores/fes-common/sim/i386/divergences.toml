# Divergence list for the i386 lockstep oracle (Bochs at CPU level 3, see
# scripts/fes_i386_oracle.py). Every case where the oracle disagrees with a
# corpus, or the two corpora disagree with each other, has an entry here naming
# the case that decides it. The FES CPU follows the side named by `follow`;
# results the 386 manual leaves undefined follow the corpora. The runners fail
# on a failure no entry covers and on an entry that no longer matches.
#
# [[vectors]]  SingleStepTests/80386 (scripts/test_fes_i386_vectors.py).
#   opcodes  MOO stems without 66/67 prefixes ("*" for any), with optional
#   when     predicates on the instruction (see PREDICATES in the runner);
#   files    exact MOO stems; or
#   cases    named tests, as [<file>#<index>, <hash>] pairs.
#   fields   the failing keys the entry accounts for ("*" for any). A failure is
#            covered when the applicable entries together account for every key.
#   deciding_case / deciding_hash  the test that decides the entry.
#   oracle / corpus  what each side does.
#
# [[test386]]  test386.asm (scripts/test_fes_i386_test386.py). A "branch" or
#   "fault" entry names a failed check by the linear address and listing text of
#   its instruction; the runner steps over exactly that check. An "ee" entry
#   names a POST EEh line of test386-EE-reference.txt.
#
# [[corpora]]  test386 TEST_UNDEF cases that SingleStepTests states with the same
#   inputs contradict.

