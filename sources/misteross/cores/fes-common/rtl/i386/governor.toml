stems = ["0F22.1", "0F22.2", "0F22.3", "0F22.4", "0F22.5", "0F22.6", "0F22.7"]
cost = [4, 4, 4]

# SALC (D6h), which the data sheets leave out: a register ALU operation's cost.
[[class]]
