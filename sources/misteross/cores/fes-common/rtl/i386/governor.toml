# 0F01h /5 and /7 raise #UD on the 386, and a faulting instruction does not
# retire (its delivery is charged as INT), so this cost is never charged.
[[class]]
name = "group7_ud"
stems = ["0F01.5", "0F01.7"]
cost = [2, 2, 1]

# MOV r32, CRn: 6 on the 386 and 4 on the i486 for every register.
[[class]]
name = "mov_from_cr"
stems = ["0F20"]
cost = [6, 6, 4]

# MOV CRn, r32: the data sheets' CR0 counts (10 and 16); CR2 and CR3 take 4
# (CR1 and CR4 to CR7 raise #UD).
[[class]]
name = "mov_to_cr0"
stems = ["0F22.0"]
cost = [10, 10, 16]

[[class]]
