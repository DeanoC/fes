# The speed governor's presets and reference costs (docs/i386-cpu-design.md,
# "Speed control"; scripts/fes_i386_governor.py builds fes_i386_gov_pkg.sv and
# fes_i386_gov_rom.sv from this, and the governor benches read it).
#
# A preset is a cost table, a frequency, a wait-state charge and a data bus
# width. Its ID is word 0 of the fes.pc386.machine record (mister-packages
# docs/computer-io.md); 0 is max, which has no table. frequency is in units of
# 100 kHz, as the record's override (word 1) is. wait is charged for every
# memory bus cycle. On a 16-bit bus a dword access takes two bus cycles: it
# adds a second cycle's two clocks and its wait states. The wait states are
# starting points for Phase 3's tuning by play.
#
# Each class lists the encodings it costs, by the lockstep's stems
# (scripts/test_fes_i386_lockstep.py): opcode, or 0Fh and opcode, in hex;
# ".n" the ModRM reg field; "/r" a register operand (mod 3), "/m" a memory
# one; ":16" or ":32" the operand size; ":rep" or ":norep" a REP prefix; "a-b"
# a range of opcodes. A class with no form costs every form.
#
# cost is the clock count in real address mode on the 80286, the Intel386 DX
# and the i486, in that order, with the data sheets' m (the next
# instruction's bytes or components) taken as one and no wait states. A
# branch class also has taken: cost is then the count when it falls through.
# INTO's "taken" is its JNO jumping, that is no interrupt. A REP string has
# element, charged as each element retires; cost is then the base, charged
# as the instruction ends. A range charges its middle, rounded up; a count n
# that the instruction's bytes do not give is taken as 4 for a 286 shift and
# 8 for a 386 bit scan, and ENTER as level 0. The 286 has no 32-bit operands
# and no 386 instructions: its table charges a 32-bit form as the 16-bit one
# and a 386 instruction as the 386 does. On every table an address of base,
# index and displacement costs one more (memory = true classes).
#
# Sources: the 286, 386 and 486 columns of "80x86 Integer Instruction Set
# (8088 - Pentium)" (https://www2.math.uni-wuppertal.de/~fpf/Uebungen/GdR-SS02/opcode_i.html),
# which compiles the Intel data sheets' counts, checked against MAME's 386
# and 486 tables (src/devices/cpu/i386/cycles.h) and 286 table
# (src/devices/cpu/i86/i286.cpp). Where they differ the compiled table wins.

[[preset]]
id = 1
name = "286-12"
table = "286"
frequency = 120
wait = 1
bus = 16

[[preset]]
