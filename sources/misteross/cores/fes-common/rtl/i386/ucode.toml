# The i386 microcode routines (scripts/fes_i386_ucode.py builds
# fes_i386_ucode_pkg.sv and fes_i386_ucode_rom.sv from this). A routine's first uop is decoded by DC, with
# the instruction; the ROM holds the rest, from its entry (UC_<NAME>) on. Each
# uop sets fields of fes_i386_pkg's ucode_t; the rest default to zero, and
# whatever the routine does not set comes from the instruction in dc (operand
# size, the vector, the ModRM operand). Sizes "osz" follow the operand size.
#
# Registers: s1, s2 and d name GPRs; d also names t0 and t1 (the
# temporaries) or a segment register. a = "t1" takes src1's value from T1;
# b = "sel" takes src2's from the selector of segment seg, "eip" from the
# next instruction's EIP. A stack slot (stk = "peek") is ESP plus slot
# operand-sized slots, -8 to 7, with ESP unmoved; sp_step = true steps ESP
# past the eight slots, down from a slot below ESP, up from one above.
# s1 or s2 = "reg" is the instruction's register (the ModRM reg field), which
# DC's first uop carries in src1, and rm = true addresses the instruction's
# ModRM operand. bound = true makes a CMP BOUND's check: #BR (vector 5) when
# src1's value is below src2's, signed; it writes no flags.
# b = "far" takes src2's value from the far pointer's selector (JMP ptr's),
# "t1" from T1, "sys" from the system register sys names. plus2 = true
# addresses the ModRM operand plus 2, wrapped by address size. d also names
# T2 and T3, and "reg", the instruction's register.
#
# Protected mode (fes_i386_cpu, "Protected mode"). desc = "lo" or "hi" reads
# the low or high dword of the descriptor T0's selector names, at GDTR's
# base plus the selector's index times 8, or the LDT's for TI=1: "lo" checks
# the index against the table's limit (#GP(selector)), and for a null
# selector D drops both reads. dmode = "probe" (LAR, LSL, VERR, VERW) drops
# them for a selector past its table too, raising nothing; dmode = "gdt"
# (LLDT, LTR) for a TI=1 selector, which their check refuses. desc = "acc"
# stores the descriptor's access byte with the accessed bit set, which D
# drops when the bit is set already or the selector is null; desc = "busy"
# stores its high dword with the TSS busy bit set (LTR). A uop's segchk
# raises the staged descriptor's checks first (M1): "data" for DS, ES, FS
# and GS (SS when the instruction loads SS), "jmp" for a far jump's CS,
# "call" for a far call's (its offset apart, "off", after the stack's
# probes), "ret" for RETF's and IRET's with the offset, "gate" for a
# delivery's gate, "intcs" for its CS with the gate's offset, "ldt" and
# "tss" for LLDT's and LTR's descriptor: each #GP, #NP or #SS with the
# selector, #GP(0) for a null SS or CS or an offset past the new limit, or
# #GP or #NP with the IDT entry. desc = "idtlo" and "idthi" read a
# delivery's gate at IDTR's base plus the vector times 8, "idtlo" checking
# it against IDTR's limit. segw = true writes the instruction's segment
# register (the far jump's: CS) from the descriptor at WB; shadow = true, on
# the uop that ends a MOV SS or POP SS, starts the interrupt shadow. nochk =
# true makes POP's step of ESP an access of nothing, checked against nothing.
# gsz = true gives the uop the gate's operand size; errp = true marks the
# error code's slot, whose probe and store D drops for a delivery without
# one, and whose jump's step of ESP is a slot less then. nwrap = true checks
# a protected-mode far CALL's, RETF's or IRET's stack slot on a 16-bit stack
# without the 64 KiB wrap, as Bochs does. iimm = true keeps the
# instruction's immediate (RETF imm16's) rather than the word's. d and b
# also name T4 (IRET's EFLAGS image). A slot is -16 to 15.
#
# Privilege transitions (fes_i386_cpu, "Privilege transitions"). hold =
# true on a CS check's uop makes WB keep the staged CS descriptor and
# whether the transfer changes privilege (xp): an IRET to an outer
# privilege, a delivery to an inner one. xc = "xp" issues the uop only with
# xp, xc = "same" only without; D turns the other into a NOP. xs = true on a
# delivery's jump steps ESP two slots further with xp (the old SS and ESP).
# nstk = true addresses the new stack: the staged SS's base at
# T5 plus the slot, checked against the staged SS (#SS with its selector).
# tss = "esp" and "ss" read the new stack's ESP and SS from the TSS for
# the held CS's DPL, the first checked against TR's limit (#TS with TR's
# selector); dmode = "ts" makes a descriptor read past its table #TS.
# desc = "hacc" stores the held CS's accessed bit; xfer = true on the far
# jump writes CS from the hold, and with xp SS from the staged descriptor
# and ESP from T5 plus imm (an outer return also nulls ES, DS, FS and GS
# below the new CPL). d and b also name T5.
#
# A protected-mode far CALL (pcall, pcallm): its descriptor's check holds
# it and says whether it is a call gate (cg). xc = "direct" issues the uop
# only to a code segment, "gate" only through a call gate, "gsame" only
# through one to the same privilege; xend = true ends the routine at the
# uop when its xc keeps it. pm = "load" and "store" are a call gate's
# parameter copy, which repeats for the gate's count (fes_i386_seq); pm =
# "below" puts the uop's slot below the parameters, with xp. zx = true
# stores the old ESP or the return EIP as SP or IP from a 16-bit stack or
# code segment. pimm = true addresses the stack slot past the instruction's
# immediate too (RETF imm16's SS and ESP). op = "gate" with imm = 1 splits
# a call gate (T2 and T3) as GATE splits a delivery's. op = "dr" writes T1
# into the debug register imm names (iimm, the instruction's).
#
# V86 mode (fes_i386_cpu, "V86 mode"). vgo = true on a protected-mode
# IRET's word makes it and the word after it NOPs for an IRETD at CPL 0
# whose EFLAGS image (T4) has VM set, and the routine goes on at v86ret
# (fes_i386_seq). v86 = true on a segment load (cls = "segment", op =
# "load", d a segment register) gives the segment V86 mode's cache; on the
# far jump into V86 mode it sets VM and CPL 3, loads ESP from T5 and CS as
# a V86 segment, with EIP T1's low word; on a delivery's jump out of it
# (xfer) it clears VM and nulls ES, DS, FS and GS. segchk = "v86cs" raises
# a delivery's CS checks ("intcs") and #GP(selector) for a CS that is not
# nonconforming code below CPL 3; "v86dpl" #GP(selector) for one whose DPL
# is not 0, the selector T0's while T0 still holds it.

# IN and OUT at a CPL above IOPL (allow_io): DC puts the port in T5 (DX, or
# the imm8). The ROM reads the TSS's I/O permission bitmap's base, the word
# at 66h, into T4 (#GP(0) for a TSS that is not a 386 one of 104 bytes or
# more: tss = "iomap"); the bitmap's word for the port into T2, at that base
# plus the port's byte, #GP(0) past TR's limit (tss = "bitmap"); then the
# port's bits for the access's size (segchk = "iobm": any set, #GP(0)); then
# the access the first uop kept (iof).
[[routine]]
name = "iochk"
uops = [
    { cls = "alu", op = "mov", d = "t4", size = "32", mkind = "load", mbytes = "2", tss = "iomap" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "2", tss = "bitmap" },
    { cls = "alu", op = "mov", segchk = "iobm" },
    { cls = "alu", op = "mov", iof = true },
]

# The ESC instructions with no 387 (fes_i386_cpu, "ESC with no 387"). rm =
# true addresses the ModRM operand plus fpn operand-sized fields plus fpj
# dwords, wrapped by address size: an x87 environment's fields (fpn 0-6),
# its save image's register dwords (fpn 7, fpj 0-19), or an 8- or 10-byte
# operand's parts. b = "sys" with sys = "ones" gives all ones, the fields
# the absent 387 supplies, and "fip", "fcs", "fdp" and "fds" the words of
# the x87 instruction and data pointers in the layout CR0.PE picks. x87p =
# "ip" or "ipdp" writes the x87 pointers as the uop retires.

# PUSHA and PUSHAD. Each register goes to its own slot below ESP, from the
# lowest address up, as the 386EX stores them, and ESP moves only at the
# last: DC decodes EDI's store at slot -8, and the ROM stores ESI, EBP, ESP
# (unmoved, so the original), EBX, EDX, ECX and EAX, whose store steps ESP
# down past the eight slots. Each slot checks its own limit, so a block that
# wraps the 64 KiB stack misaligned stores the slots below the one that
# straddles, then raises #SS with ESP unmoved, as the 386EX does (divergence
# stack-wrap-partial-transfer).
[[routine]]
name = "pusha"
uops = [
    { cls = "alu", op = "mov", s2 = "esi", mkind = "store", in_a = true, stk = "peek", slot = -7 },
    { cls = "alu", op = "mov", s2 = "ebp", mkind = "store", in_a = true, stk = "peek", slot = -6 },
    { cls = "alu", op = "mov", s2 = "esp", mkind = "store", in_a = true, stk = "peek", slot = -5 },
    { cls = "alu", op = "mov", s2 = "ebx", mkind = "store", in_a = true, stk = "peek", slot = -4 },
    { cls = "alu", op = "mov", s2 = "edx", mkind = "store", in_a = true, stk = "peek", slot = -3 },
    { cls = "alu", op = "mov", s2 = "ecx", mkind = "store", in_a = true, stk = "peek", slot = -2 },
    { cls = "alu", op = "mov", s2 = "eax", mkind = "store", in_a = true, stk = "peek", slot = -1, sp_step = true },
]

# POPA and POPAD. Each slot from ESP up loads its register, as the 386EX
# loads them, and ESP moves only at the last: DC decodes DI's load from slot
# 0, and the ROM loads SI, BP, ESP's slot into T1, BX, DX, CX and AX, whose
# load steps ESP up past the eight slots. A block that wraps the 64 KiB
# stack misaligned loads the slots below the one that straddles, ESP's
# among them, then raises #SS with ESP unmoved (divergence
# stack-wrap-partial-transfer). POPAD on a 16-bit stack then takes ESP's
# high word from the image, as the 386EX does (divergence
# popad-esp-high-word): a 16-bit MOV merges SP into T1 (a = "t1") and
# writes ESP. D keeps that uop only for POPAD on a 16-bit stack
# (popad_esp).
[[routine]]
name = "popa"
uops = [
    { cls = "alu", op = "mov", s1 = "esi", d = "esi", mkind = "load", stk = "peek", slot = 1 },
    { cls = "alu", op = "mov", s1 = "ebp", d = "ebp", mkind = "load", stk = "peek", slot = 2 },
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", stk = "peek", slot = 3 },
    { cls = "alu", op = "mov", s1 = "ebx", d = "ebx", mkind = "load", stk = "peek", slot = 4 },
    { cls = "alu", op = "mov", s1 = "edx", d = "edx", mkind = "load", stk = "peek", slot = 5 },
    { cls = "alu", op = "mov", s1 = "ecx", d = "ecx", mkind = "load", stk = "peek", slot = 6 },
    { cls = "alu", op = "mov", s1 = "eax", d = "eax", mkind = "load", stk = "peek", slot = 7, sp_step = true },
    { cls = "alu", op = "mov", a = "t1", s2 = "esp", d = "esp", size = "16", popad_esp = true },
]

# The vector's offset into T1, then INT's routine. INTO enters here when OF
# is set: DC decodes a JNO to the next instruction that ends INTO if taken,
# and the vector is 4. An exception enters here too: WB flushes, and DC takes
# a NOP that starts this routine with the fault's vector, at length 0, so the
# IP pushed is the faulting instruction's. INT n and INT3: DC decodes the
# read of the vector's offset into T1. Real-mode interrupt entry, as the
# 386EX does it, reads the vector's entry before pushing (divergence
# interrupt-vector-before-push): the selector into T0, a probe of the three
# 16-bit slots, FLAGS (IF and TF then clear), CS and the next IP, then the far
# jump to T0:T1.
[[routine]]
name = "vector"
falls_through = true
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", mbytes = "2", ivt = true },
]

[[routine]]
name = "int"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", mbytes = "2", ivt = true, sel_part = true },
    { cls = "alu", op = "mov", mkind = "load", mbytes = "2", stk = "probe", probe = "int" },
    { cls = "alu", op = "flags", imm = 11, size = "16", mkind = "store", mbytes = "2", in_a = true, stk = "push", rd_cf = true, rd_oszap = true },
    { cls = "alu", op = "movzx", src_size = "16", size = "16", b = "sel", seg = "cs", mkind = "store", mbytes = "2", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", size = "16", b = "eip", mkind = "store", mbytes = "2", in_a = true, stk = "push" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true },
]

# IRET and IRETD. DC decodes the read of the offset, slot 0, into T1; the ROM
# reads CS's slot into T0, then FLAGS' slot into FLAGS (IRETD's RF too, as
# Bochs loads it), which first checks the offset against CS's limit
# (far_chk), then jumps, stepping ESP past the three slots (stk = "retf",
# slot 3).
[[routine]]
name = "iret"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", stk = "peek", slot = 1 },
    { cls = "alu", op = "flags", imm = 12, mkind = "load", stk = "peek", slot = 2, far_chk = true, far_t = true, wr_cf = true, wr_oszap = true },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, sp_add = true, stk = "retf", slot = 3, iret = true },
]

# The return to V86 mode (stack_return_to_v86): piret's vgo word goes on
# here for an IRETD at CPL 0 whose EFLAGS image (T4) has VM set, CS's slot
# in T0 and the offset's in T1. ESP's slot into T5; a probe of SS's, ES's,
# DS's and FS's slots, then GS's load, so every slot is read before
# anything is written, as Bochs reads all six first; FS, DS, ES and SS from
# their slots (dwords, each selector the low word, without the 64 KiB wrap
# on a 16-bit stack), each a V86 segment; the flags from T4 (at CPL 0,
# IOPL, IF and RF too); then the jump, which loads CS (T0) as a V86
# segment, EIP from T1's low word (Bochs checks no limit) and ESP from T5,
# and sets VM and CPL 3.
[[routine]]
name = "v86ret"
uops = [
    { cls = "alu", op = "mov", d = "t5", size = "32", mkind = "load", stk = "peek", slot = 3, nwrap = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = 4, nwrap = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = 5, nwrap = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = 6, nwrap = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = 7, nwrap = true },
    { cls = "segment", op = "load", d = "gs", size = "16", mkind = "load", stk = "peek", slot = 8, nwrap = true, v86 = true },
    { cls = "segment", op = "load", d = "fs", size = "16", mkind = "load", stk = "peek", slot = 7, nwrap = true, v86 = true },
    { cls = "segment", op = "load", d = "ds", size = "16", mkind = "load", stk = "peek", slot = 6, nwrap = true, v86 = true },
    { cls = "segment", op = "load", d = "es", size = "16", mkind = "load", stk = "peek", slot = 5, nwrap = true, v86 = true },
    { cls = "segment", op = "load", d = "ss", size = "16", mkind = "load", stk = "peek", slot = 4, nwrap = true, v86 = true },
    { cls = "alu", op = "flags", imm = 12, b = "t4", wr_cf = true, wr_oszap = true },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, iret = true, v86 = true },
]

# IRET and IRETD in V86 mode at IOPL 3 (iret16_stack_return_from_v86 and
# iret32's; below IOPL 3 DC raises #GP(0)): the real-mode routine, but with
# no check of the offset against CS's limit (Bochs loads IRETD's whole; past
# FFFFh the next fetch faults), CS loaded as a V86 segment and the flags by
# CPL 3: IF, not IOPL or VM.
[[routine]]
name = "viret"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", stk = "peek", slot = 1 },
    { cls = "alu", op = "flags", imm = 12, mkind = "load", stk = "peek", slot = 2, wr_cf = true, wr_oszap = true },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, sp_add = true, stk = "retf", slot = 3, iret = true },
]

# A delivery from V86 mode (protected_mode_int with v8086_mode()): DC's
# entry as pvec's, or INT n's and INT3's first uop the gate's low dword
# (INT n at IOPL 3; below it DC raises #GP(0)). As pint, but its CS must be
# nonconforming code below CPL 3 (#GP(selector), as the hold's check), whose
# DPL, after the TSS's stack is read, must be 0 (#GP(selector)), so it
# always moves to the stack of CPL 0. The stores, at the gate's size, push
# GS, FS, DS and ES first, then SS, ESP, EFLAGS (VM set), CS, EIP and the
# error code; the jump clears VM and nulls ES, DS, FS and GS.
[[routine]]
name = "vvec"
falls_through = true
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", mbytes = "4", desc = "idtlo" },
]

[[routine]]
name = "vint"
uops = [
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "idthi" },
    { cls = "system", op = "gate", d = "t0", segchk = "gate", tgo = true, tgk = "int" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", segchk = "v86cs", hold = true },
    { cls = "alu", op = "mov", d = "t5", size = "32", mkind = "load", tss = "esp" },
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", mbytes = "2", tss = "ss", segchk = "v86dpl" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts" },
    { cls = "alu", op = "mov", segchk = "ssint" },
    { cls = "alu", op = "mov", segchk = "hoff" },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -1, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -2, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -3, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -4, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -5, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -6, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -7, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -8, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -9, gsz = true, nstk = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -10, gsz = true, errp = true, nstk = true },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "gs", mkind = "store", in_a = true, stk = "peek", slot = -1, gsz = true, nstk = true },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "fs", mkind = "store", in_a = true, stk = "peek", slot = -2, gsz = true, nstk = true },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "ds", mkind = "store", in_a = true, stk = "peek", slot = -3, gsz = true, nstk = true },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "es", mkind = "store", in_a = true, stk = "peek", slot = -4, gsz = true, nstk = true },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "ss", mkind = "store", in_a = true, stk = "peek", slot = -5, gsz = true, nstk = true },
    { cls = "alu", op = "mov", s2 = "esp", mkind = "store", in_a = true, stk = "peek", slot = -6, gsz = true, nstk = true },
    { cls = "alu", op = "flags", imm = 13, mkind = "store", in_a = true, stk = "peek", slot = -7, gsz = true, rd_cf = true, rd_oszap = true, nstk = true },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "cs", mkind = "store", in_a = true, stk = "peek", slot = -8, gsz = true, nstk = true },
    { cls = "alu", op = "mov", b = "eip", mkind = "store", in_a = true, stk = "peek", slot = -9, gsz = true, nstk = true },
    { cls = "alu", op = "mov", b = "sys", sys = "err", mkind = "store", in_a = true, stk = "peek", slot = -10, gsz = true, errp = true, nstk = true },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "hacc" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true, sp_add = true, stk = "retf", slot = -8, gsz = true, errp = true, xs = true, xfer = true, v86 = true },
]

# INS and OUTS under the I/O permission bitmap: in V86 mode, or at a CPL
# above IOPL (allow_io, once before a REP's first element, its count 0
# too). DC decodes the string's first uop as a NOP that starts this
# routine: DX into T5, then iochk's reads of the bitmap's base and the
# port's word and its check for the element's size; then the string's
# first uop, which starts the string (iof, fes_i386_seq).
[[routine]]
name = "iostr"
uops = [
    { cls = "alu", op = "mov", s2 = "edx", d = "t5", size = "32" },
    { cls = "alu", op = "mov", d = "t4", size = "32", mkind = "load", mbytes = "2", tss = "iomap" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "2", tss = "bitmap" },
    { cls = "alu", op = "mov", segchk = "iobm" },
    { cls = "special", iof = true },
]

# BOUND. DC decodes the load of the upper bound, past the lower by the
# operand size and wrapped by address size, into T1, with the register in
# src1. The ROM loads the lower bound and compares the register with it,
# then compares T1 with the register: each raises #BR when its first operand
# is below its second, signed. Both loads check their limits before either
# compare, as the 386EX does: a bound past the limit raises #GP(0) or #SS(0)
# even when the register is outside the other. The fault pushes BOUND's own
# IP, and BOUND writes no register or flag.
[[routine]]
name = "bound"
uops = [
    { cls = "alu", op = "cmp", s1 = "reg", mkind = "load", rm = true, bound = true },
    { cls = "alu", op = "cmp", a = "t1", s2 = "reg", bound = true },
]

# MOV CRn, r32 and LMSW: DC puts the source in T1; the write, at WB, jumps
# to the next instruction, so every instruction after it decodes and reads
# CR0 anew. D raises #GP(0) for a CR0 with PG set and PE clear, and stops a
# CR0 with both set as not built: paging is not.
[[routine]]
name = "wcr0"
uops = [
    { cls = "system", op = "cr0", b = "t1" },
]

[[routine]]
name = "wcr2"
uops = [
    { cls = "system", op = "cr2", b = "t1" },
]

[[routine]]
name = "wcr3"
uops = [
    { cls = "system", op = "cr3", b = "t1" },
]

# MOV DRn, r32: DC puts the register in T1 and the debug register's number
# in imm, which the write keeps (iimm).
[[routine]]
name = "wdr"
uops = [
    { cls = "system", op = "dr", b = "t1", iimm = true },
]

[[routine]]
name = "lmsw"
uops = [
    { cls = "system", op = "lmsw", b = "t1" },
]

# LGDT and LIDT: DC loads the limit's word into T0; the base's dword, 2
# bytes on, goes into T1, and the table register takes both, its base's top
# byte cleared at a 16-bit operand size, with a jump to the next
# instruction. Both reads check their limits before the write.
[[routine]]
name = "lgdt"
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", mbytes = "4", rm = true, plus2 = true },
    { cls = "system", op = "gdtr", b = "t1" },
]

[[routine]]
name = "lidt"
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", mbytes = "4", rm = true, plus2 = true },
    { cls = "system", op = "idtr", b = "t1" },
]

# SGDT and SIDT: DC stores the limit's word; the base's dword goes 2 bytes
# on, all 32 bits whatever the operand size, as Bochs stores it.
[[routine]]
name = "sgdt"
uops = [
    { cls = "alu", op = "mov", size = "32", mkind = "store", mbytes = "4", in_a = true, rm = true, plus2 = true, b = "sys", sys = "gdtb" },
]

[[routine]]
name = "sidt"
uops = [
    { cls = "alu", op = "mov", size = "32", mkind = "store", mbytes = "4", in_a = true, rm = true, plus2 = true, b = "sys", sys = "idtb" },
]

# MOV Sreg, r/m16 in protected mode: DC puts the selector in T0. The
# descriptor's dwords into T2 and T3, then its checks, the accessed bit and
# the segment's write.
[[routine]]
name = "pseg"
uops = [
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "data", segw = true, shadow = true },
]

# POP Sreg in protected mode: DC reads the selector's word at SS:ESP into T0,
# ESP unmoved. After the load, ESP steps by the operand size, at the width
# SS had for the read, as Bochs pops before it loads.
[[routine]]
name = "ppop"
uops = [
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "data", segw = true },
    { cls = "alu", op = "mov", mkind = "load", stk = "pop", nochk = true, shadow = true },
]

# LES, LDS, LSS, LFS and LGS in protected mode: DC loads the selector, past
# the offset by the operand size, into T0. The offset into T1, the
# segment's load, then the register from T1.
[[routine]]
name = "plptr"
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", rm = true },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "data", segw = true },
    { cls = "alu", op = "mov", s1 = "reg", d = "reg", b = "t1" },
]

# A far JMP in protected mode, at CPL 0 to a code segment (no gates): JMP
# ptr's offset is in T1 (DC) and its selector goes into T0; JMP m16:16/32's
# selector is in T0 (DC) and its offset goes into T1. The descriptor's
# dwords, its checks with the offset's against the new limit and the
# accessed bit, then the jump, which writes CS from the descriptor, its
# selector's RPL 0.
[[routine]]
name = "pjmp"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "far" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "jmp", tgo = true, tgk = "jmp" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true },
]

[[routine]]
name = "pjmpm"
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", rm = true },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "jmp", tgo = true, tgk = "jmp" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true },
]

# A protected-mode exception's, INTR's or NMI's delivery, and INT n's
# (protected_mode_int), through an interrupt or trap gate (fes_i386_cpu,
# "Protected-mode delivery"). The entry is the NOP the real-mode one is,
# here; INT n and INT3 start at pint, DC decoding the gate's low dword into
# T1; INTO's JNO falls into pvec with vector 4. The gate's high dword into
# T3; GATE raises the gate's checks (M1; a software interrupt's against
# CPL) and at WB puts its selector in T0 and offset in T1, with its size
# and kind; the code descriptor's dwords and their checks, which WB holds
# with xp for a nonconforming CS below CPL, an inner privilege. That reads
# the new stack's ESP into T5 and SS into T0 from the TSS for CS's DPL,
# SS's descriptor (#TS past its table) and its checks. Then the offset's
# check against the held CS's limit; a probe of each slot the delivery
# pushes, at the gate's size, as Bochs pushes each (with xp on the new
# stack, two more, for the old SS and ESP, which it pushes first); the
# stores (with xp on the new stack): with xp the old SS and ESP, then EFLAGS (RF set for a fault, TF
# and NT cleared, IF for an interrupt gate), CS, EIP and the error code,
# if the exception has one; CS's accessed bit, with xp SS's; then the far
# jump, which steps ESP past the pushes, or with xp loads SS and ESP and
# takes CS's DPL as the CPL.
[[routine]]
name = "pvec"
falls_through = true
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", mbytes = "4", desc = "idtlo" },
]

