    { cls = "alu", op = "flags", imm = 13, mkind = "store", in_a = true, stk = "peek", slot = -1, gsz = true, rd_cf = true, rd_oszap = true, xc = "same" },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "cs", mkind = "store", in_a = true, stk = "peek", slot = -2, gsz = true, xc = "same" },
