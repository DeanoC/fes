# IRET and IRETD in protected mode (iret_protected): DC reads the EFLAGS
# slot into T4; the ROM reads CS's slot into T0 and the offset's into T1, in
# Bochs's order, so a frame past the stack's limit faults before any read;
# each at SP plus its slot without the 64 KiB wrap on a 16-bit stack, as
# Bochs reads them. An IRETD at CPL 0 whose image has VM set returns to V86
# mode (vgo, v86ret). Then CS's descriptor and its checks, which WB holds with xp for a return
# to an outer privilege (RPL above CPL). That reads SS's word slot into T0,
# its descriptor and checks against the new CPL, and ESP's slot into T5.
# Then the offset's check against the held CS's limit with its accessed
# bit, SS's accessed bit, the flags from T4 (and RF, for IRETD; IF and IOPL
# by the CPL the IRET runs at), and the jump, which steps ESP past the
# three slots, or with xp loads SS and ESP and nulls the data segments the
# new CPL may not use.
[[routine]]
name = "piret"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", stk = "peek", slot = 1, nwrap = true },
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", stk = "peek", slot = 0, nwrap = true },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", vgo = true },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", segchk = "ret", hold = true },
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", mbytes = "2", stk = "peek", slot = 4, nwrap = true, xc = "xp" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", xc = "xp" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", xc = "xp" },
    { cls = "alu", op = "mov", segchk = "ssret", xc = "xp" },
    { cls = "alu", op = "mov", d = "t5", size = "32", mkind = "load", stk = "peek", slot = 3, nwrap = true, xc = "xp" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "hacc", segchk = "hoff" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", xc = "xp" },
    { cls = "alu", op = "flags", imm = 12, b = "t4", wr_cf = true, wr_oszap = true },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true, sp_add = true, stk = "retf", slot = 3, iret = true, xfer = true },
]

# RETF and RETF imm16 in protected mode (return_protected): DC reads CS's
# slot into T0; the ROM reads the offset's into T1, in Bochs's order, as IRET
# does, then CS's descriptor and its checks, which WB holds with xp for a
# return to an outer privilege (RPL above CPL). To the same privilege, the
# offset's check with the accessed bit and the jump, which ends the routine.
# With xp, SS's word slot
# into T0 and ESP's slot into T5, each past the two slots and imm16 (pimm),
# then SS's descriptor and its checks against the new CPL. Then the
# offset's check against the held CS's limit with its accessed bit, SS's
# accessed bit, and the jump, which loads SS and ESP (T5 plus imm16) and
# nulls the data segments the new CPL may not use.
[[routine]]
name = "pretf"
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", stk = "peek", slot = 0, nwrap = true },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", segchk = "ret", hold = true },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "hacc", segchk = "hoff", xc = "same" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true, sp_add = true, stk = "retf", slot = 2, iimm = true, xfer = true, xc = "same", xend = true },
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", mbytes = "2", stk = "peek", slot = 3, nwrap = true, iimm = true, pimm = true, xc = "xp" },
    { cls = "alu", op = "mov", d = "t5", size = "32", mkind = "load", stk = "peek", slot = 2, nwrap = true, iimm = true, pimm = true, xc = "xp" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", xc = "xp" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", xc = "xp" },
    { cls = "alu", op = "mov", segchk = "ssret", xc = "xp" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "hacc", segchk = "hoff", xc = "xp" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", xc = "xp" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true, stk = "retf", slot = 2, iimm = true, xfer = true },
]

# A far CALL in protected mode (call_protected): CALL ptr's offset is in T1
# (DC) and its selector goes into T0; CALL m16:16/32's selector is in T0
# (DC) and its offset goes into T1. The descriptor's dwords and its checks,
# which WB holds: a code segment (direct), or a call gate (gate), whose
# other system types stop as not built. Direct: a probe of each of the two
# slots, at SP less its slot without the 64 KiB wrap on a 16-bit stack, as
# Bochs writes them; the offset's check against the held limit with the
# accessed bit; CS and the next EIP, each an operand-sized slot; the jump,
# which steps ESP past them and ends the routine. Through a
# call gate (call_gate): its selector into T0 and offset into T1, with its
# size and parameter count; the code descriptor's dwords and checks, which
# WB holds with xp for a nonconforming CS below CPL, an inner privilege.
# With xp, the new stack's ESP into T5 and SS into T0 from the TSS for CS's
# DPL, SS's descriptor (#TS past its table) and its checks; then in Bochs's
# order on the new stack, at the gate's size: the old SS, the old ESP (SP
# from a 16-bit stack), each parameter from the old stack's highest down,
# CS and the return EIP (IP from 16-bit code). The parameter's load and
# store repeat for the gate's count (pm). Without xp, CS and the next EIP
# pushed at the gate's size, wrapping as PUSH does. Then the gate's offset
# against the held limit with the accessed bit, and with xp SS's. The jump
# writes CS from the hold and steps ESP past the two slots at the gate's
# size, or with xp loads SS and ESP.
[[routine]]
name = "pcall"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "far" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi" },
    { cls = "alu", op = "mov", segchk = "call", hold = true, tgo = true, tgk = "call" },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -1, nwrap = true, xc = "direct" },
    { cls = "alu", op = "mov", mkind = "load", stk = "probe", slot = -2, nwrap = true, xc = "direct" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "hacc", segchk = "hoff", xc = "direct" },
    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "cs", mkind = "store", in_a = true, stk = "peek", slot = -1, xc = "direct" },
    { cls = "alu", op = "mov", b = "eip", mkind = "store", in_a = true, stk = "peek", slot = -2, xc = "direct" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true, sp_add = true, stk = "retf", slot = -2, gsz = true, xfer = true, xc = "direct", xend = true },
    { cls = "system", op = "gate", imm = 1, d = "t0", xc = "gate" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", xc = "gate" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", xc = "gate" },
    { cls = "alu", op = "mov", segchk = "intcs", hold = true, xc = "gate" },
    { cls = "alu", op = "mov", d = "t5", size = "32", mkind = "load", tss = "esp", xc = "xp" },
