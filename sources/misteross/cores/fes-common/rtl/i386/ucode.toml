# The i386 microcode routines (scripts/fes_i386_ucode.py builds
# fes_i386_ucode.sv from this). A routine's first uop is decoded by DC, with
# the instruction; the ROM holds the rest, from its entry (UC_<NAME>) on. Each
# uop sets fields of fes_i386_pkg's ucode_t; the rest default to zero, and
# whatever the routine does not set comes from the instruction in dc (operand
# size, the vector, the ModRM operand). Sizes "osz" follow the operand size.
#
# Registers: s1, s2 and d name GPRs; d also names t0 and t1 (the
# temporaries) or a segment register. b = "t1" takes the value stored from
# T1, "sel" the selector of segment seg, "eip" the next instruction's EIP.

# PUSHA and PUSHAD. DC decodes the probe of all eight slots (probe =
# "pusha"); the ROM keeps the original ESP in T1 and pushes EAX, ECX, EDX,
# EBX, that ESP, EBP, ESI and EDI.
[[routine]]
name = "pusha"
uops = [
    { cls = "alu", op = "mov", s2 = "esp", d = "t1", size = "32" },
    { cls = "alu", op = "mov", s2 = "eax", mkind = "store", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", s2 = "ecx", mkind = "store", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", s2 = "edx", mkind = "store", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", s2 = "ebx", mkind = "store", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", b = "t1", mkind = "store", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", s2 = "ebp", mkind = "store", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", s2 = "esi", mkind = "store", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", s2 = "edi", mkind = "store", in_a = true, stk = "push" },
]

# POPA and POPAD. DC decodes the probe of all eight slots from ESP up
# (probe = "popa"); the ROM pops EDI, ESI, EBP, reads ESP's slot into T1,
# and pops EBX, EDX, ECX and EAX. POPAD on a 16-bit stack then takes ESP's
# high word from that image, as the 386EX does (divergence
# popad-esp-high-word): a 16-bit MOV merges SP into T1 (a = "t1") and
# writes ESP. D keeps that uop only for POPAD on a 16-bit stack
# (popad_esp).
[[routine]]
name = "popa"
uops = [
    { cls = "alu", op = "mov", s1 = "edi", d = "edi", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", s1 = "esi", d = "esi", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", s1 = "ebp", d = "ebp", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", s1 = "ebx", d = "ebx", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", s1 = "edx", d = "edx", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", s1 = "ecx", d = "ecx", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", s1 = "eax", d = "eax", mkind = "load", stk = "pop" },
    { cls = "alu", op = "mov", a = "t1", s2 = "esp", d = "esp", size = "16", popad_esp = true },
]
