    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "cs", mkind = "store", in_a = true, stk = "peek", slot = -4, gsz = true, nstk = true, xc = "xp" },
    { cls = "alu", op = "mov", b = "eip", mkind = "store", in_a = true, stk = "peek", slot = -5, gsz = true, nstk = true, xc = "xp" },
