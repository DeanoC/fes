# The new task's descriptors (Bochs's task_switch after its commit, in the
# 386's order, 7AB-7D6): DC takes this routine, at the new EIP and length 0,
# right after the commit, so a fault here is the new task's. The LDT from
# the GDT (null: none; TI=1, past the table, not an LDT or not present,
# #TS(selector)); SS (TSSS: null, TI or type wrong, RPL or DPL not CS's RPL
# #TS(selector), then not present #SS(selector)), after which the CPL is
# CS's RPL (tscpl; Bochs runs these two at CPL 3); CS (TSCS: null, not
# code, nonconforming with DPL not RPL or conforming with DPL above it
# #TS(selector), not present #NP(selector)), held; DS, ES, FS and GS
# (TSDATA: none for null, which keeps the selector alone; not data or
# readable code, or data or nonconforming code with DPL below CPL or RPL
# #TS(selector), not present #NP(selector)); each with its accessed bit.
# Then a delivery's error code, pushed at the new TSS's size; and the jump
# to the new EIP, which writes CS from the hold. Bochs then checks EIP
# against CS's limit; the 386 does not (7D0-7E2), and its fetch faults.
[[routine]]
name = "tsload"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sys", sys = "ldtr" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts", xc = "nnull" },
    { cls = "system", op = "tsldtd", segchk = "tsldt", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sel", seg = "ss" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "tsss", segw = true, wsg = true, seg = "ss", tscpl = true },
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sel", seg = "cs" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "tscs", hold = true },
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sel", seg = "ds" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "tsdata", segw = true, wsg = true, seg = "ds", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sel", seg = "es" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "tsdata", segw = true, wsg = true, seg = "es", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sel", seg = "fs" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "tsdata", segw = true, wsg = true, seg = "fs", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sel", seg = "gs" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", size = "8", mkind = "store", mbytes = "1", in_a = true, desc = "acc", segchk = "tsdata", segw = true, wsg = true, seg = "gs", xc = "nnull" },
    { cls = "alu", op = "mov", b = "sys", sys = "err", mkind = "store", in_a = true, stk = "push", gsz = true, xc = "err" },
    { cls = "alu", op = "mov", d = "t1", size = "32", b = "eip" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, segw = true, xfer = true },
]

# A switch into a V86 task (VM set in the new EFLAGS): the LDT as tsload's;
# SS, DS, ES, FS and GS from their selectors as V86 segments, with no
# descriptor read or check; a delivery's error code; then the far jump,
# which loads CS as one, at CPL 3 (Bochs's task_switch; the 386's 798-7A5).
[[routine]]
name = "tsv86"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sys", sys = "ldtr" },
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "ts", xc = "nnull" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "ts", xc = "nnull" },
    { cls = "system", op = "tsldtd", segchk = "tsldt", xc = "nnull" },
    { cls = "segment", op = "load", d = "ss", b = "sel", seg = "ss" },
    { cls = "segment", op = "load", d = "ds", b = "sel", seg = "ds" },
    { cls = "segment", op = "load", d = "es", b = "sel", seg = "es" },
    { cls = "segment", op = "load", d = "fs", b = "sel", seg = "fs" },
    { cls = "segment", op = "load", d = "gs", b = "sel", seg = "gs" },
    { cls = "alu", op = "mov", b = "sys", sys = "err", mkind = "store", in_a = true, stk = "push", gsz = true, xc = "err" },
    { cls = "alu", op = "mov", d = "t0", size = "32", b = "sel", seg = "cs" },
    { cls = "alu", op = "mov", d = "t1", size = "32", b = "eip" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true },
]

# LLDT (CPL 0): DC puts the selector in T0. Its descriptor from the GDT
# (none for a null or TI=1 selector), then LDTR's write from it at WB, which
# raises the checks first: TI=1, not an LDT, #GP(selector); not present,
# #NP(selector). A null selector loads an LDTR no TI=1 selector passes.
[[routine]]
name = "plldt"
uops = [
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "gdt" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "gdt" },
    { cls = "system", op = "ldtr", segchk = "ldt" },
]

# LTR (CPL 0): DC puts the selector in T0. Its descriptor from the GDT; the
# checks (null, #GP(0); TI=1, not an available TSS, #GP(selector); not
# present, #NP(selector)) with the store of its high dword, the busy bit
# set, as Bochs stores it; then TR's write.
[[routine]]
name = "pltr"
uops = [
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "gdt" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "gdt" },
    { cls = "alu", op = "mov", size = "32", mkind = "store", mbytes = "4", in_a = true, desc = "busy", segchk = "tss" },
    { cls = "system", op = "tr" },
]

# LAR, LSL, VERR and VERW: DC puts the selector in T0, the register in src1.
# Its descriptor's dwords, read only if the selector is not null and within
# its table; then ZF, and for LAR and LSL the register, from what M1 works
# out of the staged descriptor: the access rights (descriptor bits 8-23) or
# the scaled limit when the descriptor passes the instruction's checks, else
# ZF clear and the register kept.
[[routine]]
name = "plar"
uops = [
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "probe" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "probe" },
    { cls = "segment", op = "zf", s1 = "reg", d = "reg", b = "sys", sys = "lar", wr_oszap = true },
]

[[routine]]
name = "plsl"
uops = [
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "probe" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "probe" },
    { cls = "segment", op = "zf", s1 = "reg", d = "reg", b = "sys", sys = "lsl", wr_oszap = true },
]

[[routine]]
