# Task switches (fes_i386_cpu, "Task switches"), in the 386's order where it
# shows (reenigne/x86_microcode, 80386/microcode_notes.txt 65C-7E4). A far
# JMP's or CALL's descriptor check, or a delivery's gate (tgo), goes on at
# tsjg (a JMP or CALL to a task gate: its TSS's selector into T0), tsgate
# (an interrupt or exception through one) or tsw (a JMP or CALL to a TSS),
# with the switch's kind (tgk, decoded_t tsk); an IRET with NT set starts at
# tssave from DC. tsgate reads the TSS's descriptor from the GDT and checks
# it (TSGATE: null, TI=1 or not an available TSS #GP(selector), not present
# #NP(selector)). tsw checks the new TSS's limit (#TS with its selector) and
# the old one's (#TS with TR's), as Bochs's task_switch; reads the new TSS's
# first and last bytes, so a #PF there comes before anything is written, as
# Bochs probes them (the 386 has no probe: an exception the RTL makes); and
# sets the new TSS's busy bit, before the old task is saved, as the 386 does
# (74B-74C).
[[routine]]
name = "tsjg"
falls_through = true
uops = [
    { cls = "system", op = "gate", imm = 1, d = "t0" },
]

[[routine]]
name = "tsgate"
falls_through = true
uops = [
    { cls = "alu", op = "mov", d = "t2", size = "32", mkind = "load", mbytes = "4", desc = "lo", dmode = "gdt" },
    { cls = "alu", op = "mov", d = "t3", size = "32", mkind = "load", mbytes = "4", desc = "hi", dmode = "gdt" },
    { cls = "alu", op = "mov", segchk = "tsgate" },
]

[[routine]]
name = "tsw"
falls_through = true
uops = [
    { cls = "alu", op = "mov", segchk = "tsw" },
    { cls = "alu", op = "mov", d = "t4", size = "32", mkind = "load", tss = "nfld", tsf = 0 },
    { cls = "alu", op = "mov", d = "t4", size = "32", mkind = "load", tss = "nfld", tsf = 31 },
    { cls = "alu", op = "mov", size = "32", mkind = "store", mbytes = "4", in_a = true, desc = "busy" },
]

# The old task's save, in its TSS's layout (tss fld: TR's TSS, tsf its
# field): EIP (the next instruction's, or a fault's own), EFLAGS (READ_TSS:
# RF as a delivery's frame takes it, NT clear for IRET's), the GPRs, and the
# selectors, FS and GS only in a 386 TSS (IRET's first checks the old TSS's
# limit, TSOLD, which tsw checks for the others). Then IRET's back link (the
# 386 saves first, 65F-667): its word at the old TSS's 0 into T0, its descriptor
# from the GDT (dmode ts: past the table #TS) and TSRET's checks (null, TI=1
# or not a busy TSS #TS(selector), not present #NP(selector)), then tsw's
# limits and reads. A nesting switch stores the old TR's selector as the new
# TSS's back link; JMP and IRET clear the old TSS's busy bit (TRHI, UNBUSY).
# TR takes the new TSS (TSTR, after which tss fld names it); the new EIP
# into T1, EFLAGS into T4, the GPRs into their registers (a 286 TSS's words
# with ones above), CS's selector into T0, the others' into their segments
# with their caches refused (TSEL; a 286 TSS's FS and GS null), the LDT's
# selector into T5 and LDTR (TSLDT), a 386 TSS's CR3 into T2 under paging;
# a 386 TSS's word at 64h, whose bit 0 is the T bit, into T5 (the 386's
# 781-784; the commit arms its #DB, fes_i386_cpu "Debug traps"),
# the flags from T4 (LOAD_TSS: NT set too for a nesting switch), and the
# commit (tcom): a far jump to the new EIP that writes CS's selector, CR3,
# CR0.TS and DR7's local enables, and after which DC takes tsload or tsv86.
