# ARPL (protected mode): DC moves the source register into T2, with the
# destination's register in src1 (rg). The destination's word into T1 (its
# register, or a load of the operand); then ZF, set when T1's RPL is below
# T2's, and the destination's write of T1 with T2's RPL, which D drops
# otherwise: a memory operand then sees neither a store nor a write check,
# as the 386 manual and test386 have it (divergence arpl-no-write-no-fault).
[[routine]]
name = "parplr"
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", s2 = "reg" },
    { cls = "segment", op = "zf", size = "16", s1 = "reg", d = "reg", b = "sys", sys = "arpl", wr_oszap = true },
]

[[routine]]
name = "parplm"
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", mbytes = "2", rm = true },
    { cls = "segment", op = "zf", size = "16", mkind = "store", mbytes = "2", in_a = true, rm = true, b = "sys", sys = "arpl", wr_oszap = true },
]

# FNSTENV and FNSAVE with no 387: DC decodes the control word's store of
# all ones at the operand; the ROM stores the status and tag words' all
# ones, then the instruction pointer's offset and its selector word, the
# data pointer's offset and its selector word (b = "sys"; each read in D
# once every older uop that writes the x87 pointers has retired), in the
# 387's 16- or 32-bit layout by the operand size, each field operand-sized.
# FNSAVE then stores the eight registers' 80 bytes as all ones, a dword at
# a time. Each store checks its own limit, in Bochs's order, so one that
# faults leaves the fields below it written.
[[routine]]
name = "fnstenv"
uops = [
    { cls = "alu", op = "mov", mkind = "store", in_a = true, rm = true, fpn = 1, b = "sys", sys = "ones" },
    { cls = "alu", op = "mov", mkind = "store", in_a = true, rm = true, fpn = 2, b = "sys", sys = "ones" },
    { cls = "alu", op = "mov", mkind = "store", in_a = true, rm = true, fpn = 3, b = "sys", sys = "fip" },
    { cls = "alu", op = "mov", mkind = "store", in_a = true, rm = true, fpn = 4, b = "sys", sys = "fcs" },
    { cls = "alu", op = "mov", mkind = "store", in_a = true, rm = true, fpn = 5, b = "sys", sys = "fdp" },
    { cls = "alu", op = "mov", mkind = "store", in_a = true, rm = true, fpn = 6, b = "sys", sys = "fds" },
]

