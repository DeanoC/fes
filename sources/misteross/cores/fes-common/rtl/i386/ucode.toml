# The i386 microcode routines (scripts/fes_i386_ucode.py builds
# fes_i386_ucode_pkg.sv and fes_i386_ucode_rom.sv from this). A routine's first uop is decoded by DC, with
# the instruction; the ROM holds the rest, from its entry (UC_<NAME>) on. Each
# uop sets fields of fes_i386_pkg's ucode_t; the rest default to zero, and
# whatever the routine does not set comes from the instruction in dc (operand
# size, the vector, the ModRM operand). Sizes "osz" follow the operand size.
#
# Registers: s1, s2 and d name GPRs; d also names t0 and t1 (the
# temporaries) or a segment register. a = "t1" takes src1's value from T1;
# b = "sel" takes src2's from the selector of segment seg, "eip" from the
# next instruction's EIP. A stack slot (stk = "peek") is ESP plus slot
# operand-sized slots, -8 to 7, with ESP unmoved; sp_step = true steps ESP
# past the eight slots, down from a slot below ESP, up from one above.

# PUSHA and PUSHAD. Each register goes to its own slot below ESP, from the
# lowest address up, as the 386EX stores them, and ESP moves only at the
# last: DC decodes EDI's store at slot -8, and the ROM stores ESI, EBP, ESP
# (unmoved, so the original), EBX, EDX, ECX and EAX, whose store steps ESP
# down past the eight slots. Each slot checks its own limit, so a block that
# wraps the 64 KiB stack misaligned stores the slots below the one that
# straddles, then raises #SS with ESP unmoved, as the 386EX does (divergence
# stack-wrap-partial-transfer).
[[routine]]
name = "pusha"
uops = [
    { cls = "alu", op = "mov", s2 = "esi", mkind = "store", in_a = true, stk = "peek", slot = -7 },
    { cls = "alu", op = "mov", s2 = "ebp", mkind = "store", in_a = true, stk = "peek", slot = -6 },
    { cls = "alu", op = "mov", s2 = "esp", mkind = "store", in_a = true, stk = "peek", slot = -5 },
    { cls = "alu", op = "mov", s2 = "ebx", mkind = "store", in_a = true, stk = "peek", slot = -4 },
    { cls = "alu", op = "mov", s2 = "edx", mkind = "store", in_a = true, stk = "peek", slot = -3 },
    { cls = "alu", op = "mov", s2 = "ecx", mkind = "store", in_a = true, stk = "peek", slot = -2 },
    { cls = "alu", op = "mov", s2 = "eax", mkind = "store", in_a = true, stk = "peek", slot = -1, sp_step = true },
]

# POPA and POPAD. Each slot from ESP up loads its register, as the 386EX
# loads them, and ESP moves only at the last: DC decodes DI's load from slot
# 0, and the ROM loads SI, BP, ESP's slot into T1, BX, DX, CX and AX, whose
# load steps ESP up past the eight slots. A block that wraps the 64 KiB
# stack misaligned loads the slots below the one that straddles, ESP's
# among them, then raises #SS with ESP unmoved (divergence
# stack-wrap-partial-transfer). POPAD on a 16-bit stack then takes ESP's
# high word from the image, as the 386EX does (divergence
# popad-esp-high-word): a 16-bit MOV merges SP into T1 (a = "t1") and
# writes ESP. D keeps that uop only for POPAD on a 16-bit stack
# (popad_esp).
[[routine]]
name = "popa"
uops = [
    { cls = "alu", op = "mov", s1 = "esi", d = "esi", mkind = "load", stk = "peek", slot = 1 },
    { cls = "alu", op = "mov", s1 = "ebp", d = "ebp", mkind = "load", stk = "peek", slot = 2 },
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", stk = "peek", slot = 3 },
    { cls = "alu", op = "mov", s1 = "ebx", d = "ebx", mkind = "load", stk = "peek", slot = 4 },
    { cls = "alu", op = "mov", s1 = "edx", d = "edx", mkind = "load", stk = "peek", slot = 5 },
    { cls = "alu", op = "mov", s1 = "ecx", d = "ecx", mkind = "load", stk = "peek", slot = 6 },
    { cls = "alu", op = "mov", s1 = "eax", d = "eax", mkind = "load", stk = "peek", slot = 7, sp_step = true },
    { cls = "alu", op = "mov", a = "t1", s2 = "esp", d = "esp", size = "16", popad_esp = true },
]

# The vector's offset into T1, then INT's routine. INTO enters here when OF
# is set: DC decodes a JNO to the next instruction that ends INTO if taken,
# and the vector is 4. An exception enters here too: WB flushes, and DC takes
# a NOP that starts this routine with the fault's vector, at length 0, so the
# IP pushed is the faulting instruction's. INT n and INT3: DC decodes the
# read of the vector's offset into T1. Real-mode interrupt entry, as the
# 386EX does it, reads the vector's entry before pushing (divergence
# interrupt-vector-before-push): the selector into T0, a probe of the three
# 16-bit slots, FLAGS (IF and TF then clear), CS and the next IP, then the far
# jump to T0:T1.
[[routine]]
name = "vector"
falls_through = true
uops = [
    { cls = "alu", op = "mov", d = "t1", size = "32", mkind = "load", mbytes = "2", ivt = true },
]

[[routine]]
name = "int"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", mbytes = "2", ivt = true, sel_part = true },
    { cls = "alu", op = "mov", mkind = "load", mbytes = "2", stk = "probe", probe = "int" },
    { cls = "alu", op = "flags", imm = 11, size = "16", mkind = "store", mbytes = "2", in_a = true, stk = "push", rd_cf = true, rd_oszap = true },
    { cls = "alu", op = "movzx", src_size = "16", size = "16", b = "sel", seg = "cs", mkind = "store", mbytes = "2", in_a = true, stk = "push" },
    { cls = "alu", op = "mov", size = "16", b = "eip", mkind = "store", mbytes = "2", in_a = true, stk = "push" },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true },
]

# IRET and IRETD. DC decodes the read of the offset, slot 0, into T1; the ROM
# reads CS's slot into T0, then FLAGS' slot into FLAGS, which first checks
# the offset against CS's limit (far_chk), then jumps, stepping ESP past the
# three slots (stk = "retf", slot 1).
[[routine]]
name = "iret"
uops = [
    { cls = "alu", op = "mov", d = "t0", size = "32", mkind = "load", stk = "peek", slot = 1 },
    { cls = "alu", op = "flags", imm = 9, mkind = "load", stk = "peek", slot = 2, far_chk = true, far_t = true, wr_cf = true, wr_oszap = true },
    { cls = "branch", op = "jmp", far_jmp = true, far_t = true, sp_add = true, stk = "retf", slot = 1, iret = true },
]
