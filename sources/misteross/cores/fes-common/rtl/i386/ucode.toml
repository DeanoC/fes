    { cls = "alu", op = "movzx", src_size = "16", b = "sel", seg = "ss", mkind = "store", in_a = true, stk = "peek", slot = -1, gsz = true, nstk = true, xc = "xp" },
    { cls = "alu", op = "mov", s2 = "esp", mkind = "store", in_a = true, stk = "peek", slot = -2, gsz = true, nstk = true, xc = "xp" },
