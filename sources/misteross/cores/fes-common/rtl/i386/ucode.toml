# The reads of an 8-byte operand (m64real, m64int) and a 10-byte one
# (m80real, m80bcd) with no 387, discarded: DC decodes the load of the
# highest part (the dword at 4; the word at 8), and the ROM loads the rest
# down to the dword at 0, whose uop writes the x87 pointers as it retires,
# its offset the data pointer's. A fault in any part leaves them unchanged.
[[routine]]
name = "frd8"
uops = [
    { cls = "alu", op = "mov", size = "32", mkind = "load", mbytes = "4", rm = true, x87p = "ipdp" },
]

