[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "d4ac300d9d244c6bfa9da24c30fd9cff225c3405"
order = 10
rationale = "DeanoC/yosys main commit d4ac300d9d (squash merge of #49: width detection for multi-dimensional packed arrays declared in generate blocks, fixing #41). It also brings #43 (a packed array of packed structs elaborates to its full width, fixing #34), #31 (opt_merge keeps cells marked nomerge apart) and #32 (sat folds repeated high bits of $mul). It is 487 commits past 3a5accbd, the Yosys of the repository and per-core locks, and includes the upstream Yosys 0.70 merge with its name-storage rework. This lock covers the i386 CPU RTL only, its timing spikes first: the shared toolchain.lock stays at 3a5accbd, since a pin bump there must rebuild every core it touches. The i386 RTL keeps its workarounds for the issues still open (#33, #35-#40). Pair with nextpnr bd7a1c0d and Mistral 8fcc4cb4."

