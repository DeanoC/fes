[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "e240a4653bb6578e0b267f730128f8a5dac28483"
order = 10
rationale = "DeanoC/yosys main commit e240a465, the same pin as cores/fes-pc386/toolchain.lock, so one Yosys reads the CPU for lockstep, the Quartus spikes and the pc386 seal (#1581, D2). Since 0a7927bf, the previous pin, it adds #70 (AGENTS.md only) and #76 (rename -unescape gives names unique within one run, never spells a keyword, and renames memories), which the seal's netlist program needs (#1581 S4). The shared toolchain.lock stays at 3a5accbd, since a pin bump there must rebuild every core it touches. The i386 RTL still avoids assignment patterns and keeps its workaround for #51, still open. Pair with nextpnr bd7a1c0d and Mistral 8fcc4cb4. Previous pin 0a7927bf."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4, as cores/fes-spectrum/toolchain.lock pins it; required by nextpnr bd7a1c0d."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "bd7a1c0d2e1a36ff64ad303edffac87fdabd66bb"
order = 30
rationale = "DeanoC/nextpnr main commit bd7a1c0d (squash merge of #292), the newest authenticated nextpnr, with the corrected LUT-input and M10K timing models. The i386 design takes its timing figures from it (docs/i386-cpu-design.md, the compiler row). Pair with Mistral 8fcc4cb4 (required)."

[tool.verilator]
repo = "https://github.com/verilator/verilator.git"
commit = "bbb60a403932a9f695cb6ff001ceb73de6ad9234"
order = 40
rationale = "Verilator v5.054 (2026-11-01), the newest tagged release. The i386 simulations (scripts/i386_verilator.py) take Verilator from this lock's slot only. The previous pin, 5e4151e3, was an untagged 5.051 development snapshot that stopped with an internal error at fes_i386_seq.sv:317, so lockstep evidence had used the system 5.020 and 5.032. v5.054 builds the RTL lockstep testbench with no warnings and gives the same report as system 5.032, trace hashes included (#1648). v5.054 checks case assertions by default, which 5.032 did not; the Yosys netlist builds pass --no-assert-case because Yosys marks every $pmux parallel_case."

