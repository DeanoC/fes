[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "3a5accbd78c526ab7bae32640044a2e062a3cfc9"
order = 10
rationale = "DeanoC/yosys main commit 3a5accbd (squash merge of #25: forwards A_SIGNED/B_SIGNED on MISTRAL_MUL cells); its CMake build retains the #20 inferred tri-state top-level pad mapping, native Cyclone V M10K support, fpga2sdram blackbox and #21 Cyclone V control block atom blackboxes. Paired with current DeanoC/nextpnr 5fe55f3d and Mistral 8fcc4cb4. Previous pin 5391eeb1 (merge of #20: intel_alm maps inferred tri-state top-level pads to MISTRAL_IO, splitting shared tri-state drivers per pad)."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4 (squash merge of #11: cyclonev sets every bit of known redundant multi-bit booleans such as GPIO slew_rate_slow, advertised as MISTRAL_MULTIBIT_BOOL_SET, which nextpnr #118 needs for slow slew; distinct per-bit fields such as HIP.VC_ENABLE are left alone). Keeps the indexed-node routing API (rnode_coords/pnode_coords/xycoords labels, rnode_index handles) plus the fixes current DeanoC nextpnr needs on it: implemented rnode_unlink (PR #9, MISTRAL_RNODE_UNLINK), timing target-position mask and restored hashed pnode/rnode lookups (PR #10). Carries the physical routing-mux, inverter and block-mux CRAM footprints (18db2489, af2ade0a) the FES shell/cart CRAM fence uses, and everything from b28e30a3. Fixed commit, not a moving branch; pair with nextpnr 5fe55f3d. Previous pin 7ed06e21."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "5fe55f3df5d9e48d81b41ec5134a4f3e9a6c06fe"
order = 30
rationale = "DeanoC/nextpnr commit 5fe55f3d, the final head of DeanoC/nextpnr#276, which merged as e0c84141 together with #280 and #281. Apple II, C64, Coleco and Spectrum pin this head since fes#1007, and the shared boundary validator requires its exact F0/F1 $ROUTETHRU map. All 93 ST video boundary route-throughs use that map. Over 14d21d4b it only gives the placement preview's route-through helper the inserted helper's name, and the ST routes identically: seed 4 gives a byte-identical bitstream and timing report on both. No new CLI options over 1eecf877; the ST recipe's nine 105-schema options stay at nextpnr's defaults. Pair with Yosys 3a5accbd and Mistral 8fcc4cb4 (required). Previous pin 14d21d4b; its rationale: DeanoC/nextpnr commit 14d21d4b, the head of DeanoC/nextpnr#276 on main 3fea4f9f (#271 GPU router sink sharing, #229 GPU router progress when a histogram threshold rounds down). #276 lets a user-locked boundary flip-flop keep its ALM's $ROUTETHRU inside a FES_RESERVED_RECT. Since 384aa82a (in 1eecf877) those helpers were refused, so all 119 expansion and 93 video boundary flip-flops lost the companion the ST seal and part/card builders expect. Move this pin to #276's merge commit when it lands. No new CLI options over 1eecf877; the ST recipe's nine 105-schema options stay at nextpnr's defaults. Pair with Yosys 3a5accbd and Mistral 8fcc4cb4 (required). Previous pin 1eecf877; its rationale: DeanoC/nextpnr main commit 1eecf877 (squash merge of #267, issue #236: model the terminal LUT input mux, include the terminal GOUT delay in critical-cohort timing, and rank opt-in private pins against setup deadlines); also includes #268/#269 (heap placer checks congestion capacity per constrained region) and the #172 physical-pin LUT timer that 9128800f held back. The Atari ST moves from 9128800f (fes#910): on 9128800f the ST netlist's GPU routes stayed congested and did not finish within the producer's 1800 s timeout on any of seeds 4, 5, 2, 1, 3 or 6, with or without the native video PLACE_REGION fences. The nine options 1eecf877 adds over 9128800f are set at nextpnr's defaults in the ST recipe, so the ST nextpnr argv is unchanged. Pair with Yosys 3a5accbd and Mistral 8fcc4cb4 (required). Previous pin 9128800f; its rationale: DeanoC/nextpnr main commit 9128800f, deliberately before #172 (d869795b physical-pin LUT timing, held: DeanoC/nextpnr#174) (squash merge of #173: fes_check_boundary_connectivity diagnoses unreachable frozen FES shell-to-cart boundaries before routing without relaxing any route, BEL, pin map, clock or fence; also #169: placed checkpoints with FES_PINMAP_V1 on only some cells are rejected, while checkpoints with no snapshot still warn and load). Pair with Yosys 3a5accbd and Mistral 8fcc4cb4 (required). Previous pin 6cb41766; its rationale: 6cb41766 (squash merge of #163: Mistral placed JSON checkpoints now record the FES_PINMAP_V1 folded pin states (packed constants and input inversions) and restore them before resumed routing, without locking the placement as a routed scaffold; older placed JSON stays readable with a warning; also #164 seed-racing placement-policy portfolio tooling and docs only). Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin a20f34c5; its rationale: a20f34c5 (squash merge of #162: Mistral packs a FAST_OUTPUT_REGISTER SDR output register driven through one exclusive inverter, moving the inverter ahead of the IO register with a high power-up state, and lowers the register's synchronous clear to a fabric data-select LUT below the clock enable; synchronous load and inverted outputs with live asynchronous clear stay rejected; designs without those patterns pack as before). Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin 32bc2353; its rationale: 32bc2353 (squash merge of #161: Mistral keeps unused configured PLL outputs without reserving a global-clock lane for them. That unblocks nextpnr's tests/ramtest-io native-DDR reference and is place-and-route neutral for current FES cores, including the RAM Tester netlists). Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin 0c5ed400; its rationale: 0c5ed400 (squash merge of #158: timing reports gain explicit per-endpoint setup_checked/hold_checked status and setup/hold slack in detailed net timings, plus ramtest-io SDRAM path-coverage tooling; no placement or routing change; also #159 docs). It includes 5063215e (squash merge of #157: Mistral analogue repair gets a cooperative five-minute budget, --gpu-opt analogueTimeBudget=SECONDS with 0 disabling it; when the budget runs out the best measured routing is kept or restored and re-timed through the final analogue setup/hold gate; initial routing, placer and fanout defaults unchanged; validated on the CPU backend). Also includes #155 (SDRAM placement reliability study and constraint coverage; tests/docs only) and f8ccc448 (merge of #153: Mistral external IO delay constraints and timing analysis, independent registered-pad IO boundaries, STA/placer/router criticality changes, discard of a declined route delay override before fallback; plus #145 Catch bisect notes, #148/#149 seed-racing stratification and prefix diagnostics). It descends from 1656e473 (#136 general Cyclone V PLL solver/packer), the shared FES HIP pin for menu, pong, catch, demo, ramtest and the sealed splash. Known parked P2: nextpnr#154 (external IO path report clock segment with an empty clock port). Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin 1656e473; its rationale: 1656e473 (squash merge of #136: general Cyclone V PLL solver/packer, plus reject undefined/x/z and >64-bit PLL parameters), the shared FES HIP pin for menu, pong, catch, demo, ramtest and the sealed splash. Since fdac4c7c it adds #136, #123 (DDR input on bidir pads), #126 (SDC clock groups / false paths / multicycles), #122 (pack GPIO input, output and OE registers with controls), #118 (Quartus I/O electrical and delay-chain assignments), #120/#144 seed racing, #124 secondary ALM registers (--mistral-ff4) and second LAB clock (--mistral-clkb) and #142. Still includes #121 control block atoms and QSF device options, the merge of #115, #97-#111 Mistral placement/remap/router work, the #98 plateau fix and the #108 placer timeout fix. Inherits the freeze-scaffold/cart flags (--fes-scaffold, --fes-cart), the PR #73 MISTRAL_BUF fix and the fpga2sdram BEL. Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin 585ef608 (merge of #123)."

