[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "3a5accbd78c526ab7bae32640044a2e062a3cfc9"
order = 10
rationale = "DeanoC/yosys main commit 3a5accbd (squash merge of #25: forwards A_SIGNED/B_SIGNED on MISTRAL_MUL cells); its CMake build retains the #20 inferred tri-state top-level pad mapping, native Cyclone V M10K support, fpga2sdram blackbox and #21 Cyclone V control block atom blackboxes. Paired with current DeanoC/nextpnr 8f453ebc and Mistral 8fcc4cb4. Previous pin 5391eeb1 (merge of #20: intel_alm maps inferred tri-state top-level pads to MISTRAL_IO, splitting shared tri-state drivers per pad)."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4 (squash merge of #11: cyclonev sets every bit of known redundant multi-bit booleans such as GPIO slew_rate_slow, advertised as MISTRAL_MULTIBIT_BOOL_SET, which nextpnr #118 needs for slow slew; distinct per-bit fields such as HIP.VC_ENABLE are left alone). Keeps the indexed-node routing API (rnode_coords/pnode_coords/xycoords labels, rnode_index handles) plus the fixes current DeanoC nextpnr needs on it: implemented rnode_unlink (PR #9, MISTRAL_RNODE_UNLINK), timing target-position mask and restored hashed pnode/rnode lookups (PR #10). Carries the physical routing-mux, inverter and block-mux CRAM footprints (18db2489, af2ade0a) the FES shell/cart CRAM fence uses, and everything from b28e30a3. Fixed commit, not a moving branch; pair with nextpnr 8f453ebc. Previous pin 7ed06e21."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "8f453ebc7420ad619dfe94818d869ea76dd2585f"
order = 30
rationale = "Corrected physical LUT-input and M10K timing, including terminal input muxes and critical-cohort timing fixes from nextpnr PR #267. The registered EXEC/COMMIT CPU is qualified against this model at the unchanged 74.25 MHz requirement. Pair with Yosys 3a5accbd and Mistral 8fcc4cb4."

