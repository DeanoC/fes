[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "5391eeb1e91b38a3d0e96d04f24cf921743c9c78"
order = 10
rationale = "DeanoC/yosys main head 5391eeb1 (squash merge of #20: intel_alm maps inferred tri-state top-level pads to MISTRAL_IO, splitting shared tri-state drivers per pad); its CMake build retains native Cyclone V M10K support, the fpga2sdram blackbox and the #21 Cyclone V control block atom blackboxes. Paired with current DeanoC/nextpnr d869795b and Mistral 8fcc4cb4. Previous pin 10ce0a10 (merge of #21)."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4 (squash merge of #11: cyclonev sets every bit of known redundant multi-bit booleans such as GPIO slew_rate_slow, advertised as MISTRAL_MULTIBIT_BOOL_SET, which nextpnr #118 needs for slow slew; distinct per-bit fields such as HIP.VC_ENABLE are left alone). Keeps the indexed-node routing API (rnode_coords/pnode_coords/xycoords labels, rnode_index handles) plus the fixes current DeanoC nextpnr needs on it: implemented rnode_unlink (PR #9, MISTRAL_RNODE_UNLINK), timing target-position mask and restored hashed pnode/rnode lookups (PR #10). Carries the physical routing-mux, inverter and block-mux CRAM footprints (18db2489, af2ade0a) the FES shell/cart CRAM fence uses, and everything from b28e30a3. Fixed commit, not a moving branch; pair with nextpnr 6cb41766. Previous pin 7ed06e21."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "d869795b6fe6f7f412b0bf73ba4b06688ab1adeb"
order = 30
rationale = "DeanoC/nextpnr main head d869795b (squash merge of #172: Mistral LUT delays are selected by the bound physical ALM input pin and L5/L6 mux mode instead of the logical input name, so renaming LUT inputs no longer changes reported timing for an identical bitstream; unbound and planning cells use the placement pin map; also #173: fes_check_boundary_connectivity diagnoses unreachable frozen FES shell-to-cart boundaries before routing without relaxing any route, BEL, pin map, clock or fence; and #169: placed checkpoints with FES_PINMAP_V1 on only some cells are rejected, while checkpoints with no snapshot still warn and load). Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin 6cb41766; its rationale: 6cb41766 (squash merge of #163: Mistral placed JSON checkpoints now record the FES_PINMAP_V1 folded pin states (packed constants and input inversions) and restore them before resumed routing, without locking the placement as a routed scaffold; older placed JSON stays readable with a warning; also #164 seed-racing placement-policy portfolio tooling and docs only).."

