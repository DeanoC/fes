[tool.yosys]
repo = "https://github.com/DeanoC/yosys.git"
commit = "5391eeb1e91b38a3d0e96d04f24cf921743c9c78"
order = 10
rationale = "DeanoC/yosys main head 5391eeb1 (squash merge of #20: intel_alm maps inferred tri-state top-level pads to MISTRAL_IO, splitting shared tri-state drivers per pad); its CMake build retains native Cyclone V M10K support, the fpga2sdram blackbox and the #21 Cyclone V control block atom blackboxes. Paired with current DeanoC/nextpnr 0c5ed400 and Mistral 8fcc4cb4. Previous pin 10ce0a10 (merge of #21)."

[tool.mistral]
repo = "https://github.com/DeanoC/mistral.git"
commit = "8fcc4cb41c51f8918f1d3ad70def2febcbf20d8f"
order = 20
rationale = "DeanoC fork master 8fcc4cb4 (squash merge of #11: cyclonev sets every bit of known redundant multi-bit booleans such as GPIO slew_rate_slow, advertised as MISTRAL_MULTIBIT_BOOL_SET, which nextpnr #118 needs for slow slew; distinct per-bit fields such as HIP.VC_ENABLE are left alone). Keeps the indexed-node routing API (rnode_coords/pnode_coords/xycoords labels, rnode_index handles) plus the fixes current DeanoC nextpnr needs on it: implemented rnode_unlink (PR #9, MISTRAL_RNODE_UNLINK), timing target-position mask and restored hashed pnode/rnode lookups (PR #10). Carries the physical routing-mux, inverter and block-mux CRAM footprints (18db2489, af2ade0a) the FES shell/cart CRAM fence uses, and everything from b28e30a3. Fixed commit, not a moving branch; pair with nextpnr 0c5ed400. Previous pin 7ed06e21."

[tool.nextpnr]
repo = "https://github.com/DeanoC/nextpnr.git"
commit = "0c5ed400f003fbd0d8c4cc71491b68e4323e1a13"
order = 30
rationale = "DeanoC/nextpnr main head 0c5ed400 (squash merge of #158: timing reports gain explicit per-endpoint setup_checked/hold_checked status and setup/hold slack in detailed net timings, plus ramtest-io SDRAM path-coverage tooling; no placement or routing change; also #159 docs). It includes 5063215e (squash merge of #157: Mistral analogue repair gets a cooperative five-minute budget, --gpu-opt analogueTimeBudget=SECONDS with 0 disabling it; when the budget runs out the best measured routing is kept or restored and re-timed through the final analogue setup/hold gate; initial routing, placer and fanout defaults unchanged; validated on the CPU backend). Also includes #155 (SDRAM placement reliability study and constraint coverage; tests/docs only) and f8ccc448 (merge of #153: Mistral external IO delay constraints and timing analysis, independent registered-pad IO boundaries, STA/placer/router criticality changes, discard of a declined route delay override before fallback; plus #145 Catch bisect notes, #148/#149 seed-racing stratification and prefix diagnostics). It descends from 1656e473 (#136 general Cyclone V PLL solver/packer), the shared FES HIP pin for menu, pong, catch, demo, ramtest and the sealed splash. Known parked P2: nextpnr#154 (external IO path report clock segment with an empty clock port). Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin 1656e473; its rationale: 1656e473 (squash merge of #136: general Cyclone V PLL solver/packer, plus reject undefined/x/z and >64-bit PLL parameters), the shared FES HIP pin for menu, pong, catch, demo, ramtest and the sealed splash. Since fdac4c7c it adds #136, #123 (DDR input on bidir pads), #126 (SDC clock groups / false paths / multicycles), #122 (pack GPIO input, output and OE registers with controls), #118 (Quartus I/O electrical and delay-chain assignments), #120/#144 seed racing, #124 secondary ALM registers (--mistral-ff4) and second LAB clock (--mistral-clkb) and #142. Still includes #121 control block atoms and QSF device options, the merge of #115, #97-#111 Mistral placement/remap/router work, the #98 plateau fix and the #108 placer timeout fix. Inherits the freeze-scaffold/cart flags (--fes-scaffold, --fes-cart), the PR #73 MISTRAL_BUF fix and the fpga2sdram BEL. Pair with Yosys 5391eeb1 and Mistral 8fcc4cb4 (required). Previous pin 585ef608 (merge of #123)."

