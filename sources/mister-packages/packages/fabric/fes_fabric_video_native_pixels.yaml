schema: mister-packages.v1
kind: fabric
id: fes.fabric.video.native-pixels
description: >-
  Internal native active-pixel tokens for complete-frame capture and fixed
  720p60 presentation. The shell crosses the source clock before the socket;
  the part runs entirely on the output pixel clock. Geometry and encoding
  are explicit composition parameters. This is not a GP mailbox ABI or a
  runtime video capability.
