schema: mister-packages.v1
kind: fabric
id: fes.fabric.de25-hps-window
description: >-
  A computer's window in HPS DDR on the DE25: one contiguous grant of
  WindowSpan bytes that the kernel owner allocates and publishes here while
  the machine is held; no DMA address reaches userspace. The fabric presents fes.memory.hps-ddr 1.0's
  three ports (0 is 128-bit, 1 and 2 are 64-bit) and rebases each command from
  FES_APPLICATION_HPS_DDR_WINDOW_BASE onto the grant. Every command must lie,
  with its whole burst, inside the span; one outside it, or any command
  without a valid grant, latches a sticky fault and is never issued. Bursts
  never cross a BoundaryBytes boundary. The grant changes only while every
  port is drained. One SMMU stream carries all three ports, for reads and
  writes. This contract assigns no Linux device, firewall, boot or runtime
  admission. See sources/misteross/docs/de25-hps-window.md.
major: 1
minor: 0
