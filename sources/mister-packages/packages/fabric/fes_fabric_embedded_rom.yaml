schema: mister-packages.v1
kind: fabric
id: fes.fabric.embedded-rom
major: 1
minor: 0
description: >-
  Experimental relative CSR interface for a CPU-fed 4/8 KiB ROM sink.
  Build identity, exact length, whole-image CRC and held execution are checked
  before completion. No physical address, SMC binding or package admission.
