id: fes.fabric.de25-computer
description: >-
  Diagnostic DE25 lightweight Avalon bridge for the existing fes.computer
  GPO/GPI mailbox. Offsets are peripheral-relative, not Linux physical
  addresses. Atomic GPO submission, sticky fault containment and identity do
  not confer runtime, firmware, MMIO lifetime or board admission.
