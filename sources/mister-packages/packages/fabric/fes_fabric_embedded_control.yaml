schema: mister-packages.v1
kind: fabric
id: fes.fabric.embedded.control
major: 1
minor: 0
description: >-
  Experimental Linux-free identity and single-ID AXI read-drain endpoint.
  CSR offsets are relative to a board-assigned control aperture, not a physical
  address or a GP capability. Identity is compile-time build/ABI metadata;
  package identity remains external to avoid a self-referential payload hash.
