schema: mister-packages.v1
kind: fabric
id: fes.fabric.de25-scanout
description: >-
  Disabled-by-default DE25 two-slot allocated-buffer scanout diagnostic.
  A submit captures an immutable DMA bus grant and generation; acceptance
  is separate from successful full-frame display completion. Snapshot
  registers freeze one pixel-domain observation across the control bridge.
  The explicit Linux DMA build selects the generated SMMU stream/layout.
  This contract assigns no Linux device, firewall, boot or runtime admission. See docs/de25-scanout.md.
major: 1
minor: 3
