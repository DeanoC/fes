schema: mister-packages.v1
kind: fabric
id: fes.fabric.de25-pr-control
description: >-
  Diagnostic DE25 HPS lightweight Avalon control of one partially
  reconfigurable slot. These are resource-relative offsets and a logical
  freeze/drain/reset/resume protocol, not physical MMIO addresses or permission
  to program hardware. Unknown completion requires a new FPGA configuration.
