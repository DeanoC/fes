schema: mister-packages.v1
kind: fabric
id: fes.fabric.embedded.mac
major: 1
minor: 0
description: >-
  Experimental firmware-owned fixed MAC and pinned DMA window lease. Private
  generations preserve FPGA handles. Trusted scope, grant, confirmation and
  independent drain callbacks are mandatory; no default physical supplier.
