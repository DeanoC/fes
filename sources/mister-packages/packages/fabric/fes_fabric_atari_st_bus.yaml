schema: mister-packages.v1
kind: fabric
id: fes.fabric.atari-st-bus
description: >-
  Internal registered Atari ST 68000 expansion socket. Stable requests include
  a 23-bit word address, big-endian byte lanes and function code. Responses
  provide wait-state completion, bus error, encoded IRQ and card presence.
  This fabric contract adds no GP opcode or runtime capability bit.
