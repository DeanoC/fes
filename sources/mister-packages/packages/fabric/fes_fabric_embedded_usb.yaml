schema: mister-packages.v1
kind: fabric
id: fes.fabric.embedded.usb
major: 1
minor: 0
description: >-
  Experimental firmware-owned USB-only PIO lease. Independent USB generation,
  original cold boot owner, prepare then live confirmation, and checked stop.
  SD and FPGA bridges remain held. No non-secure initialization, mixed device
  permission, physical qualification or production admission is supplied.
