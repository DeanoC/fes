schema: mister-packages.v1
kind: fabric
id: fes.fabric.de25-ddr-probe
description: >-
  Read-only DE25-Nano DDR diagnostic with a snapshotted bounded DMA bus
  descriptor. Register offsets are relative to the copied Terasic GHRD
  lightweight peripheral subsystem. This contract confers no Linux MMIO,
  DMA allocation, translation, firewall or runtime admission. See
  docs/de25-ddr.md for drain, reset and prospective framebuffer ownership.
major: 1
minor: 0
