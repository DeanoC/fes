schema: mister-packages.v1
kind: abi
id: fes.computer
description: >-
  FES home-computer mailbox. Fixed video is required; USB HID key state,
  two controller ports, fixed stereo PCM audio and removable media units are
  independently declared capabilities. Media units accept chunked CRC32
  transfers and eject while execution runs, so a medium can be changed without
  resetting the machine. Transport bits match the other FES GP ABIs.
