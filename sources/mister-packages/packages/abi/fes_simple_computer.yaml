schema: mister-packages.v1
kind: abi
id: fes.simple-computer
description: >-
  FES general-purpose HPS/FPGA mailbox for a standalone simple computer.
  Transport bits match fes.simple-game; ABI tag 2, keyboard rows, and a
  bounded media blob are distinct. Media begin/data/commit do not require
  execution reset held; launch-time hold-reset is runtime policy for the
  primary bind. Media begin with eject index and argument 0 clears
  readiness. This file does not contain MMIO or lifecycle programming
  instructions.
major: 1
minor: 0
tag: 2
