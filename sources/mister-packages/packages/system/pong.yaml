schema: mister-packages.v1
kind: system
id: pong
description: >-
  ROM-less digital Pong contract for the misteross MiSTer wrapper.
  Up/Down move the left paddle and Start begins play. Left/Right/A/B/C
  reserve the existing packet bits; the Pong wrapper ignores them.
  Software integration only; no hardware or native audio acceptance.

expected_core: Pong

rbf:
  role: core
  artifact: pong.rbf

media: []

core:
  reset_assert_word: 0x0001
  initial_status_word: 0x0001
  reset_release_word: 0x0000
  file_wire: little_endian_byte_pairs

input:
  player_count: 1
  player_command: 0x02
  up: 0x0008
  down: 0x0004
  left: 0x0002
  right: 0x0001
  a: 0x0010
  b: 0x0020
  c: 0x0040
  start: 0x0080
