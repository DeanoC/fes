[uboot]
# FES U-Boot: the upstream MiSTer uboot.img below with its compiled-in
# default environment changed from core=menu.rbf to core=idle.rbf and the
# legacy-image data/header CRC-32s recomputed (scripts/media_uboot.py).
# U-Boot programs FAT /idle.rbf, the same sealed core as the rootfs
# /usr/share/mister-runtime/idle.rbf, before `bridge enable`. Changing it
# requires media reprovisioning; a network update never rewrites U-Boot.
path = "uboot.img"
size = 515141
sha256 = "21533e9903675329e3273aebced63c87dfa781f79327c121f24153ee2a11ecb9"
environment = [
  "mmcroot=/dev/mmcblk0p1",
  "bootimage=/linux/zImage_dtb",
  "core=idle.rbf",
  "loop=linux/linux.img ro rootwait",
]

