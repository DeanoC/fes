CONFIG_MAIN_STACK_SIZE=4096
# GICv3 LPI tables require 64 KiB-aligned allocations before the main thread.
CONFIG_HEAP_MEM_POOL_SIZE=1048576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

CONFIG_PCIE=y
CONFIG_PCIE_MSI=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_GIC_V3_ITS=y
CONFIG_NVME=y
CONFIG_NVME_ADMIN_ENTRIES=16
CONFIG_NVME_IO_ENTRIES=16
CONFIG_NVME_REQUEST_TIMEOUT=5
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_READ_ONLY=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="nvme0n0"

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_INIT_TIMEOUT=5
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
