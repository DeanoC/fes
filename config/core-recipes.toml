# FES package producers (ZX81, SMS and SG-1000 format 3; other cores format 2); paths are relative to the selected misteross source.
version = 1

[[recipes]]
core_id = "fes.catch"
identity_version = 2
producer_script = "scripts/build_fes_catch.py"
producer_module = "scripts.build_fes_catch"
authenticate = "_authenticate_tools"
lock_path = "toolchain.lock"
gpu_router = "HIP"
hip_architectures = "gfx1100;gfx1201"
selection_filename = "fes-catch.package-selection.toml"
package_dir_env = "FES_CATCH_PACKAGE_DIR"
package_selection_env = "FES_CATCH_PACKAGE_SELECTION"
quartus_role = "no oracle required"

