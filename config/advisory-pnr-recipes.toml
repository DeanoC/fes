# Advisory nextpnr recipes: OSS P&R tables for cores whose registered
# producer (config/core-recipes.toml) is Quartus. Only scripts/pnr_recipe.py
# reads this file, so the OSS producers and the nextpnr cart flow stay
# runnable as advisory lanes. The production loader (scripts/recipes.py),
# package preparation and images never select these rows.
# Same [[recipes]] shape and closed [recipes.pnr] schema as the registry.

version = 1

[[recipes]]
core_id = "fes.zx81"
identity_version = 2
producer_script = "scripts/build_fes_zx81_oss.py"
producer_module = "scripts.build_fes_zx81_oss"
producer_arguments = ["--model", "zx81"]
producer_options = { model = "zx81" }
authenticate = "_authenticate_tools"
lock_path = "cores/fes-zx81/toolchain.lock"
gpu_router = "HIP"
hip_architectures = "gfx1100;gfx1201"
selection_filename = "fes-zx81.package-selection.toml"
package_dir_env = "FES_ZX81_PACKAGE_DIR"
package_selection_env = "FES_ZX81_PACKAGE_SELECTION"
quartus_role = "bring-up/check oracle"


[recipes.pnr]
seeds = [1, 3, 10]
timing_weights = [300, 1000, 2000, 100, 10]
search_weights = [10, 100, 300, 1000, 2000]
critexp = 5
freq = "74.25"
qsf = "cores/fes-zx81/constraints-oss.qsf"
sdc = "cores/fes-zx81/clocks-oss.sdc"
router = "gpu"
backend = "HIP"
gpu_device = "lease"
timeout_s = 600
threads = 1
timing_allow_fail = true
argv_style = "search"
extra = []
unset_env = ["CUDA_VISIBLE_DEVICES", "FES_GPU_IDS", "HIP_VISIBLE_DEVICES", "NEXTPNR_MISTRAL_PLACED_REDUCTION", "NEXTPNR_MISTRAL_PLACED_TIMEOUT", "NEXTPNR_MISTRAL_PLACED_TIMEOUT_REGION", "NEXTPNR_MISTRAL_RETAINED_ENABLE", "OMP_NUM_THREADS", "ROCR_VISIBLE_DEVICES"]
compress_rbf = true
detailed_timing_report = true
clocks = [{ name = "clk_sys", mhz = 52.224 }, { name = "*", mhz = 74.25 }, { name = "*", mhz = 12.288 }]
env = { PATH = "<TOOLCHAIN_BIN>:/usr/bin:/bin", HOME = "<PRIVATE_HOME>", LANG = "C", LC_ALL = "C", TZ = "UTC" }

optional_env = { CUDA_DEVICE_ORDER = "PCI_BUS_ID" }
[recipes.pnr.flags]
randomize_seed = false
placer = "heap"
cstrweight = "unset"
starttemp = "unset"
pack_only = false
no_route = false
no_place = false
no_pack = false
ignore_loops = false
ignore_rel_clk = false
no_tmdriv = false
sdf_cvc = false
no_print_critical_path_source = false
placer_heap_alpha = 0.1
placer_heap_beta = 0.9
placer_heap_cell_placement_timeout = 8
placer_heap_no_ctrl_set = false
static_dump_density = false
parallel_refine = false
router2_heatmap = "unset"
tmg_ripup = false
router2_tmg_ripup = false
router2_alt_weights = false
gpu_batches = "unset"
gpu_cpu = false
gpu_perf = false
gpu_telemetry = "unset"
gpu_opt = []
timing_report_paths = 1
seed_racing_contract = false
fes_scaffold = false
fes_cart = "unset"
fes_cart_region = "unset"
fes_slot_clock = "unset"
fes_cram_region = "unset"
mistral_ff4 = false
mistral_clkb = false
replicate_enables = 0
remap_critical = "unset"
remap_optimize_pins = false
remap_preserve_ffs = false
remap_plan = "unset"
remap_post_plan = "unset"
remap_comb_critical = "unset"
remap_comb_candidate = "unset"
remap_comb_plan = "unset"
remap_decompose_critical = "unset"
remap_decompose_candidate = "unset"
remap_lut_pair_critical = "unset"
remap_lut_pair_candidate = "unset"
remap_lut_pair_compose_copy = false
remap_lut_driver_critical = "unset"
remap_lut_driver_candidate = "unset"
remap_candidate = "unset"
remap_groups = 1
balance_reduction_root = []

arrival_pin_assignment = true
isolated_lut_placement = false
critical_cohort_budget = 0
critical_cohort_report = "unset"
mistral_dsp_signed_lanes = false
set = []
gpu_required = false
critical_cohort_model_out = "unset"
router2_profile = "unset"

